<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Pavilion Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#ddd}
canvas{display:block}
#gui{position:fixed;top:0;right:0;width:310px;height:100vh;background:rgba(10,10,20,0.94);
  border-left:1px solid rgba(255,255,255,0.07);overflow-y:auto;z-index:100;padding:14px;
  scrollbar-width:thin;scrollbar-color:#333 transparent;transition:transform .3s}
#gui.collapsed{transform:translateX(270px)}
#gui::-webkit-scrollbar{width:5px}
#gui::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
#toggle{position:fixed;top:8px;right:318px;width:32px;height:32px;background:rgba(10,10,20,0.9);
  border:1px solid rgba(255,255,255,0.12);border-radius:5px;color:#aaa;cursor:pointer;z-index:101;
  display:flex;align-items:center;justify-content:center;font-size:16px;transition:right .3s}
#toggle.collapsed{right:42px}
.gt{font-size:15px;font-weight:700;margin-bottom:14px;color:#fff;letter-spacing:1.5px;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin-bottom:14px}
.tab{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:5px;
  color:#888;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  padding:8px 0;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.tab:hover{background:rgba(255,255,255,0.07);color:#bbb}
.tab.active{background:rgba(74,158,255,0.15);border-color:rgba(74,158,255,0.5);color:#4a9eff}
.gs{margin-bottom:8px;border:1px solid rgba(255,255,255,0.06);border-radius:6px;overflow:hidden}
.gh{background:rgba(255,255,255,0.04);padding:8px 10px;cursor:pointer;display:flex;
  justify-content:space-between;align-items:center;font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;user-select:none}
.gh:hover{background:rgba(255,255,255,0.07)}
.gb{padding:8px 10px;display:none}
.gs.open .gb{display:block}
.gh .ar{transition:transform .2s;font-size:10px}
.gs.open .gh .ar{transform:rotate(90deg)}
.gr{display:flex;align-items:center;margin-bottom:6px;gap:6px;overflow:hidden}
.gr label{flex:0 0 90px;font-size:11px;color:#888}
.gr input[type=range]{flex:1;min-width:0;accent-color:#4a9eff;height:3px;cursor:pointer}
.gv{width:52px;flex:0 0 52px;text-align:right;font-size:11px;font-family:Consolas,monospace;color:#4a9eff;
  background:rgba(74,158,255,0.08);border:1px solid rgba(74,158,255,0.15);border-radius:3px;
  padding:2px 5px;outline:none}
.gv:focus{border-color:#4a9eff}
.gc{display:flex;align-items:center;margin-bottom:4px;gap:8px}
.gc label{font-size:11px;color:#888;cursor:pointer;user-select:none}
.gc input[type=checkbox]{accent-color:#4a9eff;cursor:pointer;width:14px;height:14px}
.gs-sel{flex:1;min-width:0;font-size:11px;font-family:Consolas,monospace;color:#4a9eff;
  background:rgba(74,158,255,0.08);border:1px solid rgba(74,158,255,0.15);border-radius:3px;
  padding:3px 6px;outline:none;cursor:pointer}
.gs-sel:focus{border-color:#4a9eff}
.gs-sel option{background:#1e1e1e;color:#4a9eff}
#info{position:fixed;bottom:8px;left:10px;font-size:11px;color:rgba(255,255,255,0.35);z-index:100}
#stats{position:fixed;top:8px;left:10px;font-size:11px;color:rgba(255,255,255,0.5);z-index:100;
  background:rgba(0,0,0,0.5);padding:6px 10px;border-radius:4px}
#compass{position:fixed;bottom:32px;left:10px;z-index:100}
</style>
</head>
<body>
<div id="stats"></div>
<canvas id="compass" width="90" height="90"></canvas>
<div id="info">LMB: Rotate &nbsp; RMB: Pan &nbsp; Scroll: Zoom</div>
<button id="toggle" onclick="toggleGUI()">☰</button>
<div id="gui">
  <div class="gt">Pavilion Builder</div>
  <div class="tabs">
    <button class="tab active" id="tab_pavilion" onclick="switchTab('pavilion')">Pavilion</button>
    <button class="tab" id="tab_kitchen" onclick="switchTab('kitchen')">Kitchen</button>
  </div>
  <div id="gui-sections"></div>
</div>

function cfgGet(path) {
  return path.split('.').reduce((o,k)=>o[k], CONFIG);

function cfgSet(path, val) {

// PROCEDURAL TEXTURES
// ═══════════════════════════════════════════════════════════════
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}

function woodTexture() {
  const [c, ctx] = makeCanvas(512, 512);
  ctx.fillStyle = '#8B6B2A';
  ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 60; i++) {
    ctx.strokeStyle = `rgba(50,30,5,${0.08 + Math.random()*0.15})`;
    ctx.lineWidth = 0.5 + Math.random() * 2.5;
    ctx.beginPath();
    const y = Math.random() * 512;
    ctx.moveTo(0, y);
    for (let x = 0; x < 512; x += 8) {
      ctx.lineTo(x, y + Math.sin(x*0.015 + i)*2.5 + (Math.random()-.5)*1.5);
    }
    ctx.stroke();
  }
  // knots
  for (let i = 0; i < 4; i++) {
    const kx = 50 + Math.random()*412, ky = 50 + Math.random()*412;
    const grad = ctx.createRadialGradient(kx, ky, 0, kx, ky, 8+Math.random()*6);
    grad.addColorStop(0, 'rgba(40,20,0,0.5)');
    grad.addColorStop(1, 'rgba(40,20,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(kx-20, ky-20, 40, 40);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function concreteTexture() {
  const [c, ctx] = makeCanvas(256, 256);
  ctx.fillStyle = '#B8B8B0';
  ctx.fillRect(0, 0, 256, 256);
  const imgData = ctx.getImageData(0, 0, 256, 256);
  for (let i = 0; i < imgData.data.length; i += 4) {
    const n = (Math.random()-.5)*20;
    imgData.data[i] += n; imgData.data[i+1] += n; imgData.data[i+2] += n;
  }
  ctx.putImageData(imgData, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function shingleTexture() {
  const [c, ctx] = makeCanvas(512, 512);
  ctx.fillStyle = '#2C2C2C';
  ctx.fillRect(0, 0, 512, 512);
  const rowH = 28;
  for (let row = 0; row < 20; row++) {
    const y = row * rowH;
    const offset = (row % 2) * 40;
    ctx.fillStyle = `rgb(${35+Math.random()*15},${33+Math.random()*12},${30+Math.random()*12})`;
    for (let col = -1; col < 8; col++) {
      const x = offset + col * 80;
      ctx.fillRect(x+1, y+1, 78, rowH-2);
      ctx.strokeStyle = `rgba(0,0,0,0.3)`;
      ctx.strokeRect(x+1, y+1, 78, rowH-2);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, y + rowH - 4, 512, 4);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

// ═══════════════════════════════════════════════════════════════
// ORBIT CONTROLS
// ═══════════════════════════════════════════════════════════════
const orbit = { theta: Math.PI*0.25, phi: Math.PI*0.32, radius: 14, target: null };
let dragging = false, dragBtn = -1, lastM = {x:0,y:0};
let pinchDist = 0;

function initControls() {
  orbit.target = new THREE.Vector3(0, 1.8, 0);
  updateCam();
  const el = renderer.domElement;

  el.addEventListener('mousedown', e => {
    dragging = true; dragBtn = e.button;
    lastM = {x:e.clientX, y:e.clientY};
  });
  el.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastM.x, dy = e.clientY - lastM.y;
    if (dragBtn === 0) {
      orbit.theta -= dx * 0.005;
      orbit.phi = Math.max(0.1, Math.min(Math.PI*0.95, orbit.phi - dy*0.005));
    } else if (dragBtn === 2) {
      const ps = 0.003 * orbit.radius;
      const fwd = new THREE.Vector3().subVectors(orbit.target, camera.position).normalize();
      const rt = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
      const up = new THREE.Vector3().crossVectors(rt, fwd).normalize();
      orbit.target.add(rt.multiplyScalar(-dx*ps));
      orbit.target.add(up.multiplyScalar(dy*ps));
    }
    lastM = {x:e.clientX, y:e.clientY};
    updateCam();
  });
  el.addEventListener('mouseup', ()=> dragging = false);
  el.addEventListener('mouseleave', ()=> dragging = false);
  el.addEventListener('wheel', e => {
    orbit.radius *= 1 + e.deltaY*0.001;
    orbit.radius = Math.max(2, Math.min(50, orbit.radius));
    updateCam();
  });
  el.addEventListener('contextmenu', e => e.preventDefault());

  // Touch
  el.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      dragging = true; dragBtn = 0;
      lastM = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    } else if (e.touches.length === 2) {
      pinchDist = Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY
      );
    }
  });
  el.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && dragging) {
      const dx = e.touches[0].clientX-lastM.x, dy = e.touches[0].clientY-lastM.y;
      orbit.theta -= dx*0.005;
      orbit.phi = Math.max(0.1, Math.min(Math.PI*0.95, orbit.phi - dy*0.005));
      lastM = {x:e.touches[0].clientX, y:e.touches[0].clientY};
      updateCam();
    } else if (e.touches.length === 2) {
      const d = Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY
      );
      orbit.radius *= pinchDist / d;
      orbit.radius = Math.max(2, Math.min(50, orbit.radius));
      pinchDist = d;
      updateCam();
    }
  }, {passive:false});
  el.addEventListener('touchend', ()=> dragging = false);
}

function updateCam() {
  const {radius, theta, phi, target} = orbit;
  camera.position.set(
    target.x + radius*Math.sin(phi)*Math.cos(theta),
    target.y + radius*Math.cos(phi),
    target.z + radius*Math.sin(phi)*Math.sin(theta)
  );
  camera.lookAt(target);
  if (typeof drawCompass === 'function') drawCompass();
}

function box(group, mat, w, h, d, x, y, z, rx, ry, rz) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if (rx) m.rotation.x = rx;
  if (ry) m.rotation.y = ry;
  if (rz) m.rotation.z = rz;
  m.castShadow = true;
  m.receiveShadow = true;
  group.add(m);
  return m;
}

function createMiteredBraceGeometry(length, size, shearAxis, shearAmount) {
  const geo = new THREE.BoxGeometry(size, length, size);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const t = y / length; // -0.5 to +0.5
    if (shearAxis === 'x') {
      pos.setX(i, pos.getX(i) + t * shearAmount);
    } else {
      pos.setZ(i, pos.getZ(i) + t * shearAmount);
    }
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

function clearGroup(name) {
  const g = groups[name];
  while (g.children.length) {
    const c = g.children[0];
    if (c.geometry) c.geometry.dispose();
    g.remove(c);
  }
}

// DIMENSION ANNOTATION HELPERS
// ═══════════════════════════════════════════════════════════════
function clearDimGroup(name) {
  const g = dimGroups[name];
  if (!g) return;
  while (g.children.length) {
    const c = g.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      if (c.material.map) c.material.map.dispose();
      c.material.dispose();
    }
    g.remove(c);
  }
}

function makeTextSprite(text, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 28px Consolas, monospace';
  const tw = ctx.measureText(text).width;
  const pad = 10;
  const bgW = tw + pad * 2;
  const bgH = 36;
  const bgX = (256 - bgW) / 2;
  const bgY = (64 - bgH) / 2;
  const r = 6;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.beginPath();
  ctx.moveTo(bgX + r, bgY);
  ctx.lineTo(bgX + bgW - r, bgY);
  ctx.quadraticCurveTo(bgX + bgW, bgY, bgX + bgW, bgY + r);
  ctx.lineTo(bgX + bgW, bgY + bgH - r);
  ctx.quadraticCurveTo(bgX + bgW, bgY + bgH, bgX + bgW - r, bgY + bgH);
  ctx.lineTo(bgX + r, bgY + bgH);
  ctx.quadraticCurveTo(bgX, bgY + bgH, bgX, bgY + bgH - r);
  ctx.lineTo(bgX, bgY + r);
  ctx.quadraticCurveTo(bgX, bgY, bgX + r, bgY);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = color || '#00DDFF';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.renderOrder = 999;
  sprite.scale.set(1.0, 0.25, 1);
  return sprite;
}

function createDimension(group, p1, p2, options) {
  options = options || {};
  const color = options.color || 0x00DDFF;
  const offsetDir = options.offsetDir || new THREE.Vector3(0, 1, 0);
  const offsetDist = options.offsetDist || 0.3;
  const textColor = options.textColor || '#00DDFF';

  const lineMat = new THREE.LineBasicMaterial({
    color: color, depthTest: false, transparent: true, opacity: 0.9
  });
  const faintMat = new THREE.LineBasicMaterial({
    color: color, depthTest: false, transparent: true, opacity: 0.4
  });

  const oDir = offsetDir.clone().normalize().multiplyScalar(offsetDist);
  const op1 = p1.clone().add(oDir);
  const op2 = p2.clone().add(oDir);

  // Extension lines
  const ext1 = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([p1, op1]), faintMat
  );
  ext1.renderOrder = 998;
  group.add(ext1);

  const ext2 = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([p2, op2]), faintMat
  );
  ext2.renderOrder = 998;
  group.add(ext2);

  // Main dimension line
  const dimLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([op1, op2]), lineMat
  );
  dimLine.renderOrder = 998;
  group.add(dimLine);

  // Tick marks
  const tickDir = (options.tickDir || offsetDir).clone().normalize();
  const tickLen = 0.08;

  const tickGeo1 = new THREE.BufferGeometry().setFromPoints([
    op1.clone().add(tickDir.clone().multiplyScalar(tickLen)),
    op1.clone().sub(tickDir.clone().multiplyScalar(tickLen))
  ]);
  const tick1 = new THREE.Line(tickGeo1, lineMat);
  tick1.renderOrder = 998;
  group.add(tick1);

  const tickGeo2 = new THREE.BufferGeometry().setFromPoints([
    op2.clone().add(tickDir.clone().multiplyScalar(tickLen)),
    op2.clone().sub(tickDir.clone().multiplyScalar(tickLen))
  ]);
  const tick2 = new THREE.Line(tickGeo2, lineMat);
  tick2.renderOrder = 998;
  group.add(tick2);

  // Label
  const dist = p1.distanceTo(p2);
  const label = makeTextSprite(dist.toFixed(2) + ' m', textColor);
  const mid = op1.clone().add(op2).multiplyScalar(0.5);
  mid.add(offsetDir.clone().normalize().multiplyScalar(0.08));
  label.position.copy(mid);
  group.add(label);
}

// ═══════════════════════════════════════════════════════════════
// POST GRID DIMENSIONS (derived from foundation)
// ═══════════════════════════════════════════════════════════════
function getPostGridDimensions() {
  const {length, width, extension} = CONFIG.foundation;
  const {gridCols, gridRows, innerColInset, innerColOffset, innerRowInset, innerRowOffset} = CONFIG.posts;
  const totalX = length - 2 * extension;
  const totalZ = width - 2 * extension;
  const spacingX = gridCols > 1 ? totalX / (gridCols - 1) : totalX;
  const spacingZ = gridRows > 1 ? totalZ / (gridRows - 1) : totalZ;
  // Per-column X positions with inner columns shifted toward center
  const colXPositions = [];
  for (let c = 0; c < gridCols; c++) {
    let x = -totalX/2 + c * spacingX;
    if (c > 0 && c < gridCols - 1) {
      if (x < 0) x += innerColInset;
      else if (x > 0) x -= innerColInset;
      x += innerColOffset;
    }
    colXPositions.push(x);
  }
  // Per-row Z positions with inner rows shifted toward center
  const rowZPositions = [];
  for (let r = 0; r < gridRows; r++) {
    let z = -totalZ/2 + r * spacingZ;
    if (r > 0 && r < gridRows - 1) {
      if (z < 0) z += innerRowInset;
      else if (z > 0) z -= innerRowInset;
      z += innerRowOffset;
    }
    rowZPositions.push(z);
  }
  return {totalX, totalZ, spacingX, spacingZ, gridCols, gridRows, colXPositions, rowZPositions};
}

// ═══════════════════════════════════════════════════════════════
// CROSS BEAM X POSITIONS (decoupled from post columns)
// ═══════════════════════════════════════════════════════════════
function getCrossBeamXPositions() {
  const {totalX, colXPositions} = getPostGridDimensions();
  const crossSpacing = CONFIG.beams.crossSpacing;
  const positions = [-totalX/2, totalX/2];
  const n = Math.max(0, Math.round(totalX / crossSpacing) - 1);
  if (n > 0) {
    const step = totalX / (n + 1);
    for (let i = 1; i <= n; i++) {
      let x = -totalX/2 + i * step;
      // Snap to nearest post column
      let best = colXPositions[0], bestDist = Math.abs(x - best);
      for (let j = 1; j < colXPositions.length; j++) {
        const d = Math.abs(x - colXPositions[j]);
        if (d < bestDist) { best = colXPositions[j]; bestDist = d; }
      }
      x = best;
      // Avoid duplicating edge positions
      if (Math.abs(x - (-totalX/2)) > 0.01 && Math.abs(x - totalX/2) > 0.01) {
        positions.push(x);
      }
    }
  }
  positions.sort((a, b) => a - b);
  return positions;
}

// ═══════════════════════════════════════════════════════════════
// POST POSITION CALCULATOR
// ═══════════════════════════════════════════════════════════════
function getPostPositions() {
  const {totalX, totalZ, spacingX, spacingZ, gridCols, gridRows, colXPositions, rowZPositions} = getPostGridDimensions();
  const {longSideCoverage, shortSideCoverage, postMinDist} = CONFIG.brickWall;
  const postSize = CONFIG.posts.size;
  const positions = [];

  for (let c = 0; c < gridCols; c++) {
    for (let r = 0; r < gridRows; r++) {
      if (c > 0 && c < gridCols - 1 && r > 0 && r < gridRows - 1) continue;
      const x = colXPositions[c];
      const z = rowZPositions[r];

      // Omit posts behind or too close to the brick wall
      const isBackRow = r === gridRows - 1;
      const isRightCol = c === gridCols - 1;
      // Back wall covers from right corner leftward
      if (isBackRow && longSideCoverage > 0) {
        const wallRight = totalX/2;
        const wallLeft = wallRight - totalX * longSideCoverage;
        if (x >= wallLeft - postMinDist && x <= wallRight + 0.001) continue;
      }
      // Short wall covers from back corner forward
      if (isRightCol && shortSideCoverage > 0) {
        const wallBack = totalZ/2;
        const wallFront = wallBack - totalZ * shortSideCoverage;
        if (z >= wallFront - postMinDist && z <= wallBack + 0.001) continue;
      }

      positions.push({x, z, col: c, row: r});
    }
  }
  return positions;
}

// ═══════════════════════════════════════════════════════════════
// FENCE SEGMENT CALCULATOR
// ═══════════════════════════════════════════════════════════════
function getFenceSegments() {
  const {totalX, totalZ, spacingX, spacingZ, gridCols, gridRows} = getPostGridDimensions();
  const {longSideCoverage, shortSideCoverage} = CONFIG.brickWall;
  const posts = getPostPositions();
  const segments = [];

  // Helper: check if a post exists at given col/row
  function hasPost(col, row) {
    return posts.some(p => p.col === col && p.row === row);
  }

  // --- FRONT side (row 0): segments between consecutive posts along X ---
  const frontPosts = posts.filter(p => p.row === 0).sort((a,b) => a.x - b.x);
  for (let i = 0; i < frontPosts.length - 1; i++) {
    segments.push({
      side: 'front', sideIndex: i + 1,
      x1: frontPosts[i].x, z1: frontPosts[i].z,
      x2: frontPosts[i+1].x, z2: frontPosts[i+1].z,
      postStart: true, postEnd: true
    });
  }

  // --- LEFT side (col 0): segments between consecutive posts along Z ---
  const leftPosts = posts.filter(p => p.col === 0).sort((a,b) => a.z - b.z);
  for (let i = 0; i < leftPosts.length - 1; i++) {
    segments.push({
      side: 'left', sideIndex: i + 1,
      x1: leftPosts[i].x, z1: leftPosts[i].z,
      x2: leftPosts[i].x, z2: leftPosts[i+1].z,
      postStart: true, postEnd: true
    });
  }
  // Extension from last left post to back wall corner if back row is wall-covered
  if (leftPosts.length > 0 && longSideCoverage > 0) {
    const lastLeft = leftPosts[leftPosts.length - 1];
    const backZ = totalZ / 2;
    if (backZ - lastLeft.z > 0.01) {
      segments.push({
        side: 'left', sideIndex: leftPosts.length,
        x1: lastLeft.x, z1: lastLeft.z,
        x2: lastLeft.x, z2: backZ,
        postStart: true, postEnd: false
      });
    }
  }

  // --- RIGHT side (col gridCols-1): segments between consecutive posts along Z ---
  const rightPosts = posts.filter(p => p.col === gridCols - 1).sort((a,b) => a.z - b.z);
  for (let i = 0; i < rightPosts.length - 1; i++) {
    segments.push({
      side: 'right', sideIndex: i + 1,
      x1: rightPosts[i].x, z1: rightPosts[i].z,
      x2: rightPosts[i].x, z2: rightPosts[i+1].z,
      postStart: true, postEnd: true
    });
  }
  // Extension from last right post to short wall front edge
  if (rightPosts.length > 0 && shortSideCoverage > 0) {
    const lastRight = rightPosts[rightPosts.length - 1];
    const wallFrontZ = totalZ/2 - totalZ * shortSideCoverage;
    if (wallFrontZ - lastRight.z > 0.01) {
      segments.push({
        side: 'right', sideIndex: rightPosts.length,
        x1: lastRight.x, z1: lastRight.z,
        x2: lastRight.x, z2: wallFrontZ,
        postStart: true, postEnd: false
      });
    }
  }

  // --- BACK side (row gridRows-1): only if longSideCoverage < 1.0 ---
  if (longSideCoverage < 1.0) {
    const backPosts = posts.filter(p => p.row === gridRows - 1).sort((a,b) => a.x - b.x);
    for (let i = 0; i < backPosts.length - 1; i++) {
      segments.push({
        side: 'back', sideIndex: i + 1,
        x1: backPosts[i].x, z1: backPosts[i].z,
        x2: backPosts[i+1].x, z2: backPosts[i+1].z,
        postStart: true, postEnd: true
      });
    }
    // Extension from rightmost exposed back post to wall edge
    if (backPosts.length > 0 && longSideCoverage > 0) {
      const rightmostBack = backPosts[backPosts.length - 1];
      const wallLeft = totalX/2 - totalX * longSideCoverage;
      if (wallLeft - rightmostBack.x > 0.01) {
        segments.push({
          side: 'back', sideIndex: backPosts.length,
          x1: rightmostBack.x, z1: rightmostBack.z,
          x2: wallLeft, z2: rightmostBack.z,
          postStart: true, postEnd: false
        });
      }
    }
  }

  return segments;
}

function buildGround() {
  clearGroup('ground');
  const g = groups.ground;
  const groundGeo = new THREE.PlaneGeometry(60, 60);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x4A8C3F, roughness: 0.95 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.01;
  ground.receiveShadow = true;
  g.add(ground);
}

function buildFoundation() {
  clearGroup('foundation');
  const {length, width, thickness} = CONFIG.foundation;
  box(groups.foundation, concreteMat, length, thickness, width, 0, thickness/2, 0);
}

function buildPathways() {
  clearGroup('pathways');
  const {frontLength, leftLength, width, thickness} = CONFIG.pathways;
  if (width <= 0 || thickness <= 0) return;
  const fnd = CONFIG.foundation;
  const {frontOpening, leftOpening} = CONFIG.fence;
  const segments = getFenceSegments();

  if (frontOpening > 0 && frontLength > 0) {
    const seg = segments.find(s => s.side === 'front' && s.sideIndex === frontOpening);
    if (seg) {
      const cx = (seg.x1 + seg.x2) / 2;
      const pz = -fnd.width/2 - frontLength/2;
      box(groups.pathways, concreteMat, width, thickness, frontLength, cx, thickness/2, pz);
    }
  }

  if (leftOpening > 0 && leftLength > 0) {
    const seg = segments.find(s => s.side === 'left' && s.sideIndex === leftOpening);
    if (seg) {
      const cz = (seg.z1 + seg.z2) / 2;
      const px = -fnd.length/2 - leftLength/2;
      box(groups.pathways, concreteMat, leftLength, thickness, width, px, thickness/2, cz);
    }
  }
}

function buildPosts() {
  clearGroup('posts');
  const size = CONFIG.posts.size;
  const height = CONFIG.brickWall.wallHeight;
  const fndTop = CONFIG.foundation.thickness;
  const positions = getPostPositions();
  positions.forEach(p => {
    box(groups.posts, woodMat, size, height, size, p.x, fndTop + height/2, p.z);
  });
}

function buildBeams() {
  clearGroup('beams');
  const g = groups.beams;
  const {width, height, overhang} = CONFIG.beams;
  const {totalX, totalZ, spacingX, spacingZ, gridCols, gridRows, colXPositions, rowZPositions} = getPostGridDimensions();
  const postTop = CONFIG.foundation.thickness + CONFIG.brickWall.wallHeight;

  // Long beams (run along X) — only at the ends
  const beamLenX = totalX + 2 * overhang;
  for (let r = 0; r < gridRows; r++) {
    if (r > 0 && r < gridRows - 1) continue;
    const z = rowZPositions[r];
    box(g, woodMat, beamLenX, height, width, 0, postTop + height/2, z);
  }

  // Cross beams (run along Z) — evenly spaced, decoupled from post columns
  const beamLenZ = totalZ + 2 * overhang;
  const crossXPositions = getCrossBeamXPositions();
  for (const x of crossXPositions) {
    box(g, woodMat, width, height, beamLenZ, x, postTop + height/2, 0);
  }
}

function buildRidge() {
  clearGroup('ridge');
  const g = groups.ridge;
  const {size, supportHeight, overhang} = CONFIG.ridge;
  const {totalX} = getPostGridDimensions();
  const beamTop = CONFIG.foundation.thickness + CONFIG.brickWall.wallHeight + CONFIG.beams.height;

  // Ridge supports — one per cross beam, centered on cross beams
  const crossXPositions = getCrossBeamXPositions();
  for (const x of crossXPositions) {
    box(g, woodMat, size, supportHeight, size, x, beamTop + supportHeight/2, 0);
  }

  // Ridge beam (runs along X)
  const ridgeLen = totalX + 2 * overhang;
  const ridgeY = beamTop + supportHeight + size/2;
  box(g, woodMat, ridgeLen, size, size, 0, ridgeY, 0);
}

function buildBraces() {
  clearGroup('braces');
  const g = groups.braces;
  const {size} = CONFIG.braces;
  const {totalX, totalZ, spacingX, gridCols, gridRows, colXPositions} = getPostGridDimensions();
  const postTop = CONFIG.foundation.thickness + CONFIG.brickWall.wallHeight;
  const positions = getPostPositions();

  // Post-to-beam braces — direction depends on post classification
  const braceLen = CONFIG.braces.length;
  const beamH = CONFIG.beams.height;
  const maxCol = gridCols - 1;
  const maxRow = gridRows - 1;

  // Collect all candidate braces
  const candidates = [];
  positions.forEach(p => {
    const isMinCol = p.col === 0, isMaxCol = p.col === maxCol;
    const isMinRow = p.row === 0, isMaxRow = p.row === maxRow;
    const isCorner = (isMinCol || isMaxCol) && (isMinRow || isMaxRow);

    if (isCorner) {
      candidates.push({p, axis: 'x', dir: isMinCol ? 1 : -1});
      candidates.push({p, axis: 'z', dir: isMinRow ? 1 : -1});
    } else if (isMinRow || isMaxRow) {
      candidates.push({p, axis: 'x', dir: 1});
      candidates.push({p, axis: 'x', dir: -1});
    } else {
      candidates.push({p, axis: 'z', dir: 1});
      candidates.push({p, axis: 'z', dir: -1});
    }
  });

  // Remove pairs of opposing braces that overlap (on the same line, pointing at each other)
  // Rule: once a post has lost a brace, its remaining braces are protected.
  const reach = braceLen * 0.7; // horizontal extent at 45°
  const removed = new Set();
  const postsWithRemoval = new Set(); // posts that already lost a brace
  for (let i = 0; i < candidates.length; i++) {
    if (removed.has(i)) continue;
    const a = candidates[i];
    for (let j = i + 1; j < candidates.length; j++) {
      if (removed.has(j)) continue;
      const b = candidates[j];
      if (a.p === b.p) continue;
      if (postsWithRemoval.has(a.p) || postsWithRemoval.has(b.p)) continue;
      if (a.axis !== b.axis) continue;
      if (a.dir === b.dir) continue;
      if (a.axis === 'x') {
        if (Math.abs(a.p.z - b.p.z) > 0.001) continue;
        const dist = Math.abs(a.p.x - b.p.x);
        if (dist < 2 * reach) { removed.add(i); removed.add(j); postsWithRemoval.add(a.p); postsWithRemoval.add(b.p); }
      } else {
        if (Math.abs(a.p.x - b.p.x) > 0.001) continue;
        const dist = Math.abs(a.p.z - b.p.z);
        if (dist < 2 * reach) { removed.add(i); removed.add(j); postsWithRemoval.add(a.p); postsWithRemoval.add(b.p); }
      }
    }
  }

  // Create meshes for surviving braces
  candidates.forEach(({p, axis, dir}, i) => {
    if (removed.has(i)) return;
    const geo = createMiteredBraceGeometry(braceLen, size,
      axis === 'x' ? 'x' : 'z',
      axis === 'x' ? dir * size : dir * size
    );
    const brace = new THREE.Mesh(geo, woodMat);
    if (axis === 'z') {
      brace.position.set(p.x, postTop - braceLen*0.35, p.z + dir * braceLen*0.35);
      brace.rotation.x = dir * Math.PI/4;
    } else {
      brace.position.set(p.x + dir * braceLen*0.35, postTop - braceLen*0.35, p.z);
      brace.rotation.z = -dir * Math.PI/4;
    }
    brace.castShadow = true;
    g.add(brace);
  });

  // Cross beam braces (Z-direction, at non-edge cross beam positions)
  const crossXPositions_braces = getCrossBeamXPositions();
  const {longSideCoverage} = CONFIG.brickWall;
  for (let ci = 0; ci < crossXPositions_braces.length; ci++) {
    const cx = crossXPositions_braces[ci];
    // Skip edge cross beams — those already have post-to-beam braces
    if (Math.abs(cx - (-totalX/2)) < 0.01 || Math.abs(cx - totalX/2) < 0.01) continue;

    // Front row brace: find the post at this column in the front row (row 0)
    const frontPost = positions.find(p => Math.abs(p.x - cx) < 0.01 && p.row === 0);
    if (frontPost) {
      // Z-direction brace from front post toward +Z (inward)
      [1].forEach(dir => {
        const geo = createMiteredBraceGeometry(braceLen, size, 'z', dir * size);
        const brace = new THREE.Mesh(geo, woodMat);
        brace.position.set(frontPost.x, postTop - braceLen*0.35, frontPost.z + dir * braceLen*0.35);
        brace.rotation.x = dir * Math.PI/4;
        brace.castShadow = true;
        g.add(brace);
      });
    }

    // Wall brace: at the back wall (z = totalZ/2), if the wall covers this x position
    if (longSideCoverage > 0) {
      const wallRight = totalX/2;
      const wallLeft = wallRight - totalX * longSideCoverage;
      if (cx >= wallLeft - 0.01 && cx <= wallRight + 0.01) {
        // Brace from wall into pavilion (-Z direction)
        const dir = -1;
        const geo = createMiteredBraceGeometry(braceLen, size, 'z', dir * size);
        const brace = new THREE.Mesh(geo, woodMat);
        brace.position.set(cx, postTop - braceLen*0.35, totalZ/2 + dir * braceLen*0.35);
        brace.rotation.x = dir * Math.PI/4;
        brace.castShadow = true;
        g.add(brace);
      }
    }
  }

  // Ridge braces (from support columns to ridge beam, 45° in X-Z plane)
  const {supportHeight, size: ridgeSize} = CONFIG.ridge;
  const beamTop = postTop + beamH;
  const ridgeBraceRise = supportHeight - size;
  const ridgeBraceLen = ridgeBraceRise * Math.SQRT2;

  const crossXPositions = getCrossBeamXPositions();
  for (let i = 0; i < crossXPositions.length; i++) {
    const x = crossXPositions[i];
    const dirs = i === 0 ? [1] : i === crossXPositions.length - 1 ? [-1] : [-1, 1];
    dirs.forEach(dir => {
      const geo = createMiteredBraceGeometry(ridgeBraceLen, size, 'x', dir * size);
      const brace = new THREE.Mesh(geo, woodMat);
      brace.position.set(
        x + dir * (ridgeSize/2 + ridgeBraceRise/2),
        beamTop + supportHeight - ridgeBraceRise/2,
        0
      );
      brace.rotation.z = -dir * Math.PI/4;
      brace.castShadow = true;
      g.add(brace);
    });
  }

//   // Gable-end V-braces (decorative trims under roof slope at each gable end)
//   const {trimWidth, trimHeight, trimLength} = CONFIG.braces;
//   const ridgeTop = beamTop + supportHeight + ridgeSize/2;
//   const ridgeBeamBottom = ridgeTop - ridgeSize;
//   const pitch = Math.atan2(ridgeTop - beamTop, totalZ / 2);

//   [-1, 1].forEach(xSide => {
//     const xPos = xSide * totalX / 2;
//     [-1, 1].forEach(zSide => {
//       const cy = ridgeBeamBottom - (trimLength/2) * Math.sin(pitch);
//       const cz = zSide * (trimLength/2) * Math.cos(pitch);
//       const trim = new THREE.Mesh(
//         new THREE.BoxGeometry(trimWidth, trimLength, trimHeight),
//         woodMat
//       );
//       trim.position.set(xPos, cy, cz);
//       trim.rotation.x = zSide * pitch;
//       trim.castShadow = true;
//       g.add(trim);
//     });
//   });
}

function buildRafters() {
  clearGroup('rafters');
  const g = groups.rafters;
  const {width, height, spacing, overhang} = CONFIG.rafters;
  const {totalX, totalZ, spacingX, spacingZ, gridCols, gridRows} = getPostGridDimensions();
  const beamTop = CONFIG.foundation.thickness + CONFIG.brickWall.wallHeight + CONFIG.beams.height;
  const ridgeTop = beamTop + CONFIG.ridge.supportHeight + CONFIG.ridge.size/2;

  // Rafter geometry: from beam to ridge on each side
  const halfSpanZ = totalZ / 2;
  const rise = ridgeTop - beamTop;
  const run = halfSpanZ + overhang;
  const pitch = Math.atan2(rise, halfSpanZ);
  const slopeLen = Math.sqrt(rise*rise + run*run);

  // Rafters along the ridge length
  const ridgeLen = totalX + 2 * CONFIG.ridge.overhang;
  const startX = -ridgeLen/2 + spacing/2;
  const endX = ridgeLen/2;
  const numRafters = Math.floor(ridgeLen / spacing) + 1;

  for (let i = 0; i < numRafters; i++) {
    const x = -ridgeLen/2 + spacing*0.3 + i * spacing;
    if (x > ridgeLen/2 + 0.1) break;

    // +Z side rafter
    const r1 = new THREE.Mesh(new THREE.BoxGeometry(width, height, slopeLen), woodMat);
    r1.position.set(x, beamTop + rise/2, halfSpanZ/2 + overhang/2);
    r1.rotation.x = pitch;
    r1.castShadow = true;
    g.add(r1);

    // -Z side rafter
    const r2 = new THREE.Mesh(new THREE.BoxGeometry(width, height, slopeLen), woodMat);
    r2.position.set(x, beamTop + rise/2, -(halfSpanZ/2 + overhang/2));
    r2.rotation.x = -pitch;
    r2.castShadow = true;
    g.add(r2);
  }
}

function buildRoof() {
  clearGroup('roof');
  const g = groups.roof;
  const {thickness} = CONFIG.roof;
  const {totalX, totalZ} = getPostGridDimensions();
  const beamTop = CONFIG.foundation.thickness + CONFIG.brickWall.wallHeight + CONFIG.beams.height;
  const ridgeTop = beamTop + CONFIG.ridge.supportHeight + CONFIG.ridge.size/2;

  const halfSpanZ = totalZ / 2;
  const rise = ridgeTop - beamTop;
  const run = halfSpanZ + CONFIG.rafters.overhang;
  const pitch = Math.atan2(rise, halfSpanZ);
  const slopeLen = Math.sqrt(rise*rise + run*run);
  const roofLenX = totalX + 2 * CONFIG.ridge.overhang + 0.05;

  // Texture repeat
  const rMat = roofMat.clone();
  rMat.map = roofMat.map.clone();
  rMat.map.repeat.set(roofLenX/3, slopeLen/2);
  rMat.map.needsUpdate = true;

  [1, -1].forEach(side => {
    const panel = new THREE.Mesh(
      new THREE.BoxGeometry(roofLenX, thickness, slopeLen),
      rMat
    );
    // Position: on the outer face of the rafters
    const d = CONFIG.rafters.height / 2 + thickness / 2;
    const centerY = ridgeTop - (slopeLen/2) * Math.sin(pitch) + d * Math.cos(pitch);
    const centerZ = side * ((slopeLen/2) * Math.cos(pitch) + d * Math.sin(pitch));
    panel.position.set(0, centerY, centerZ);
    panel.rotation.x = side * pitch;
    panel.castShadow = true;
    panel.receiveShadow = true;
    g.add(panel);
  });

  // Ridge cap (small box along the top)
  const capD = CONFIG.rafters.height / 2 + thickness + 0.02;
  box(g, woodMat, roofLenX, 0.04, 0.20, 0, ridgeTop + capD, 0);

  // Fascia boards along the eaves
  const eaveY = beamTop - CONFIG.rafters.overhang * Math.tan(pitch);
  const eaveZ = halfSpanZ + CONFIG.rafters.overhang;
  [1, -1].forEach(side => {
    box(g, woodMat, roofLenX, 0.18, 0.02,
      0, beamTop - 0.05, side * eaveZ);
  });
}

function buildPanelling() {
  clearGroup('panelling');
  const g = groups.panelling;
  const {plankWidth, plankThickness, gap, depthOffset} = CONFIG.panelling;
  const {totalX, totalZ} = getPostGridDimensions();
  const beamTop = CONFIG.foundation.thickness + CONFIG.brickWall.wallHeight + CONFIG.beams.height;
  const ridgeTop = beamTop + CONFIG.ridge.supportHeight + CONFIG.ridge.size / 2;
  const halfSpanZ = totalZ / 2;
  const rise = ridgeTop - beamTop;
  const run = halfSpanZ + CONFIG.rafters.overhang;
  const pitch = Math.atan2(rise, halfSpanZ);
  const slopeLen = Math.sqrt(rise * rise + run * run);
  const roofLenX = totalX + 2 * CONFIG.ridge.overhang + 0.05;
  const rafterH = CONFIG.rafters.height;

  // Wood material with repeat for planks
  const pMat = woodMat.clone();
  pMat.map = woodMat.map.clone();
  pMat.map.repeat.set(roofLenX / 1.0, plankWidth / 0.3);
  pMat.map.needsUpdate = true;

  // --- Ceiling planks (underside of each roof slope) ---
  const step = plankWidth + gap;
  const nPlanks = Math.floor(slopeLen / step);
  [1, -1].forEach(side => {
    for (let i = 0; i < nPlanks; i++) {
      const t = (i + 0.5) * step;  // distance along slope from ridge
      const isOdd = i % 2;
      // Inner face of rafters (underneath)
      const dInner = -(rafterH / 2 + plankThickness / 2 + isOdd * depthOffset);
      const cy = ridgeTop - t * Math.sin(pitch) + dInner * Math.cos(pitch);
      const cz = side * (t * Math.cos(pitch) + dInner * Math.sin(pitch));
      const plank = new THREE.Mesh(
        new THREE.BoxGeometry(roofLenX, plankThickness, plankWidth),
        pMat
      );
      plank.position.set(0, cy, cz);
      plank.rotation.x = side * pitch;
      plank.receiveShadow = true;
      g.add(plank);
    }
  });

  // --- Gable end planks (triangular closure at x = ±totalX/2) ---
  const gMat = woodMat.clone();
  gMat.map = woodMat.map.clone();
  gMat.map.repeat.set(1, plankWidth / 0.3);
  gMat.map.needsUpdate = true;

  const xOffset = 0;  // flush with the cross beam face
  [1, -1].forEach(xSide => {
    const xPos = xSide * totalX / 2;
    const nGable = Math.floor(rise / step);
    for (let i = 0; i < nGable; i++) {
      const y = beamTop + (i + 0.5) * step;
      if (y + plankWidth / 2 > ridgeTop) break;
      const frac = (y - beamTop) / rise;
      const plankLen = totalZ * (1 - frac);
      if (plankLen <= 0.01) continue;
      const isOdd = i % 2;
      const plank = new THREE.Mesh(
        new THREE.BoxGeometry(plankThickness, plankWidth, plankLen),
        gMat
      );
      plank.position.set(
        xPos - xSide * (plankThickness / 2 + isOdd * depthOffset),
        y,
        0
      );
      plank.castShadow = true;
      plank.receiveShadow = true;
      g.add(plank);
    }
  });
}

function buildBrickWall() {
  clearGroup('brickWall');
  const g = groups.brickWall;
  const {brickLength, brickWidth, brickHeight, mortarGap, wallHeight,
         longSideCoverage, shortSideCoverage} = CONFIG.brickWall;

  if (longSideCoverage <= 0 && shortSideCoverage <= 0) return;

  const {totalX, totalZ} = getPostGridDimensions();
  const postSize = CONFIG.posts.size;
  const fndTop = CONFIG.foundation.thickness;

  // Corner position (back-right): centered on post grid line
  const cornerX = totalX/2;
  const cornerZ = totalZ/2;

  // Wall spans (from post center to post center)
  const longSpan = totalX * longSideCoverage;
  const shortSpan = totalZ * shortSideCoverage;

  const stepL = brickLength + mortarGap;
  const stepH = brickHeight + mortarGap;
  const numCourses = Math.floor(wallHeight / stepH);

  // Count bricks
  const longPerCourse = Math.ceil(longSpan / stepL) + 2;
  const shortPerCourse = Math.ceil(shortSpan / stepL) + 2;
  const maxBricks = numCourses * (longPerCourse + shortPerCourse + 4);

  const brickGeo = new THREE.BoxGeometry(1, 1, 1); // unit, scaled per instance
  const brickMat = new THREE.MeshStandardMaterial({
    roughness: 0.82, metalness: 0.0, vertexColors: true
  });

  // We'll use standard MeshStandardMaterial with per-instance color via InstancedMesh
  const brickMatI = new THREE.MeshStandardMaterial({ roughness: 0.82 });
  const mesh = new THREE.InstancedMesh(brickGeo, brickMatI, maxBricks);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  const mat4 = new THREE.Matrix4();
  const pos = new THREE.Vector3();
  const quat = new THREE.Quaternion();
  const scl = new THREE.Vector3();
  const color = new THREE.Color();
  const quatZ90 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), Math.PI/2);
  const quatNone = new THREE.Quaternion();
  let idx = 0;

  for (let course = 0; course < numCourses; course++) {
    const y = fndTop + course * stepH + brickHeight/2;
    const isOdd = course % 2 === 1;

    // === BACK WALL (runs along X, centered on post grid Z) ===
    if (longSideCoverage > 0) {
      const wallZ = cornerZ;
      const wallStartX = cornerX; // starts at right corner
      const wallEndX = cornerX - longSpan;
      const offset = isOdd ? stepL/2 : 0;

      // On odd courses, corner interlock: leave space for short wall brick at corner
      const xStart = isOdd ? wallStartX - brickWidth - mortarGap : wallStartX;

      let x = xStart;
      while (x - brickLength/2 > wallEndX - stepL) {
        let bL = brickLength;
        let bx = x - brickLength/2;

        // Clip at start (right edge)
        if (bx + bL > xStart) { bL = xStart - bx; }
        // Clip at end (left edge)
        if (bx < wallEndX) { bL -= (wallEndX - bx); bx = wallEndX; }
        if (bL < mortarGap) { x -= stepL; continue; }

        pos.set(bx + bL/2, y, wallZ);
        scl.set(bL, brickHeight, brickWidth);
        mat4.compose(pos, quatNone, scl);
        mesh.setMatrixAt(idx, mat4);
        color.setHSL(0.055 + Math.random()*0.025, 0.65 + Math.random()*0.15, 0.32 + Math.random()*0.1);
        mesh.setColorAt(idx, color);
        idx++;
        x -= stepL;
      }
    }

    // === SHORT WALL (runs along Z, centered on post grid X) ===
    if (shortSideCoverage > 0) {
      const wallX = cornerX;
      const wallStartZ = cornerZ;
      const wallEndZ = cornerZ - shortSpan;
      const offset = isOdd ? 0 : stepL/2;

      // On even courses, corner interlock: leave space for long wall brick
      const zStart = !isOdd ? wallStartZ - brickWidth - mortarGap : wallStartZ;

      let z = zStart;
      while (z - brickLength/2 > wallEndZ - stepL) {
        let bL = brickLength;
        let bz = z - brickLength/2;

        if (bz + bL > zStart) { bL = zStart - bz; }
        if (bz < wallEndZ) { bL -= (wallEndZ - bz); bz = wallEndZ; }
        if (bL < mortarGap) { z -= stepL; continue; }

        pos.set(wallX, y, bz + bL/2);
        scl.set(brickWidth, brickHeight, bL);
        mat4.compose(pos, quatNone, scl);
        mesh.setMatrixAt(idx, mat4);
        color.setHSL(0.055 + Math.random()*0.025, 0.65 + Math.random()*0.15, 0.32 + Math.random()*0.1);
        mesh.setColorAt(idx, color);
        idx++;
        z -= stepL;
      }
    }
  }

  mesh.count = idx;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  g.add(mesh);

  // Mortar backing planes
  if (longSideCoverage > 0) {
    const mh = numCourses * stepH;
    box(g, mortarMat, longSpan, mh, brickWidth*0.95,
      cornerX - longSpan/2, fndTop + mh/2, cornerZ);
  }
  if (shortSideCoverage > 0) {
    const mh = numCourses * stepH;
    box(g, mortarMat, brickWidth*0.95, mh, shortSpan,
      cornerX, fndTop + mh/2, cornerZ - shortSpan/2);
  }

  updateStats(idx, numCourses);
}

function updateStats(brickCount, courses) {
  const el = document.getElementById('stats');
  el.innerHTML = `Bricks: ${brickCount} | Courses: ${courses} | Posts: ${getPostPositions().length}`;
}

// ═══════════════════════════════════════════════════════════════
// KITCHEN
// ═══════════════════════════════════════════════════════════════
// Module geometry table — physical dimensions of each VEVOR built-in (m)
//   type 0=open, 1=door, 2=trash, 3=drawer3
// w/h = outer "front-looking" dimensions including the trim flange.
// cutW/cutH = brick-opening (cutout) dimensions — the drawer faces and body fit here.
// The trim flange is a stainless rectangle that covers the brick edges around the cutout
// (outer = w × h, inner = cutW × cutH). d = body depth. Door has no body.
const KITCHEN_MOD = [
  { w: 0,     h: 0,     cutW: 0,     cutH: 0,     d: 0,     label: 'open' },
  { w: 0.79,  h: 0.79,  cutW: 0.79,  cutH: 0.79,  d: 0,     label: 'door' },
  { w: 0.344, h: 0.655, cutW: 0.320, cutH: 0.615, d: 0.510, label: 'trash' },
  { w: 0.46,  h: 0.59,  cutW: 0.425, cutH: 0.550, d: 0.595, label: 'drawer3' }
];

// Sink rim outer dimensions (m). Indexed by sinkModel.
const SINK_RIMS = [
  { w: 0.815, d: 0.500 }, // 0 = Blanco Naya 8
  { w: 1.160, d: 0.500 }, // 1 = Blanco Zia 8S
  { w: 0.880, d: 0.500 }  // 2 = Deante Eridan
];

// Door panel models (each is a French-door pair with the same handle style;
// only outer width × height changes). Indexed by kitchen.doorModel.
const DOOR_MODELS = [
  { w: 0.790, h: 0.790, label: '790×790 mm' },
  { w: 0.610, h: 0.610, label: '610×610 mm' },
  { w: 0.762, h: 0.533, label: '762×533 mm' },
  { w: 0.915, h: 0.610, label: '915×610 mm' },
  { w: 0.915, h: 0.533, label: '915×533 mm' },
  { w: 0.838, h: 0.558, label: '838×558 mm' },
  { w: 0.863, h: 0.482, label: '863×482 mm' }
];

// Slot vertical placement:
//   door (type 1)  — top flush with counter underside (existing behavior).
//   trash (type 2) — bottom at 2 brick courses above foundation; top brick course fills the gap.
//   drawer3 (type 3) — same 2-brick base; top brick course centered above.
function slotVerticalBounds(s, fndTop, counterUndersideY, stepH) {
  if (s.type === 2 || s.type === 3) {
    const moduleBottomY = fndTop + 2 * stepH;
    return { moduleBottomY, moduleTopY: moduleBottomY + s.h };
  }
  const moduleTopY = counterUndersideY;
  return { moduleBottomY: moduleTopY - s.h, moduleTopY };
}

function buildKitchen() {
  clearGroup('kitchen');
  clearGroup('kitchenBricks');
  const g = groups.kitchen;
  const gBricks = groups.kitchenBricks;
  const K = CONFIG.kitchen;
  const {brickLength, brickHeight, mortarGap} = CONFIG.brickWall;
  const wallBrickWidth = CONFIG.brickWall.brickWidth;
  const fndTop = CONFIG.foundation.thickness;

  if (K.length <= 0 || K.depth <= 0 || K.height < 0.3) return;

  // Slot configuration
  const slotCount = Math.max(1, Math.min(8, Math.round(K.slotCount)));
  const slotTypes = [];
  for (let i = 1; i <= slotCount; i++) {
    slotTypes.push(Math.max(0, Math.min(3, Math.round(K['slot' + i + 'Type']))));
  }
  // Resolve door dimensions from the selected DOOR_MODELS entry.
  const doorModelIdx = Math.max(0, Math.min(DOOR_MODELS.length - 1, Math.round(K.doorModel)));
  const doorW = DOOR_MODELS[doorModelIdx].w;
  const doorH = DOOR_MODELS[doorModelIdx].h;
  // Lookup module footprint (w, h, cutW, cutH, d) for a given slot type.
  // Doors use the selected DOOR_MODELS entry and have no separate cutout (cutW=w, cutH=h).
  const modSize = (t) => {
    if (t === 1) return { w: doorW, h: doorH, cutW: doorW, cutH: doorH, d: 0 };
    return KITCHEN_MOD[t];
  };

  // Open slots get a placeholder display width matching a drawer3 so they breathe visually
  const OPEN_W = 0.46;
  const moduleWidths = slotTypes.map(t => (t === 0 ? OPEN_W : modSize(t).w));

  // Sink and hob slots get widened so the appliance rim doesn't overlap the side dividers.
  const sinkSlotIdx0 = Math.max(1, Math.min(slotCount, Math.round(K.sinkSlot))) - 1;
  const hobSlotIdx0 = Math.max(1, Math.min(slotCount, Math.round(K.hobSlot))) - 1;
  const sinkModelIdx = Math.max(0, Math.min(SINK_RIMS.length - 1, Math.round(K.sinkModel)));
  const APPLIANCE_MARGIN = 0.04; // 20mm of slot beyond appliance edge on each side
  const HOB_W = 0.59;
  moduleWidths[sinkSlotIdx0] = Math.max(
    moduleWidths[sinkSlotIdx0],
    SINK_RIMS[sinkModelIdx].w + APPLIANCE_MARGIN
  );
  moduleWidths[hobSlotIdx0] = Math.max(moduleWidths[hobSlotIdx0], HOB_W + APPLIANCE_MARGIN);

  const totalModWidth = moduleWidths.reduce((a, b) => a + b, 0);
  const dividerThickness = 0.12; // single half-brick divider thickness

  let dividerWidth = (K.length - totalModWidth) / (slotCount + 1);
  let layoutWarning = '';
  if (dividerWidth < 0.03) {
    layoutWarning = `Doesn't fit (needs ≥ ${(totalModWidth + (slotCount + 1) * 0.03).toFixed(2)}m)`;
    dividerWidth = 0.03;
  }

  // Anchor: back-right corner of pavilion, kitchen runs in -X direction
  const {totalX, totalZ} = getPostGridDimensions();
  const cornerX = totalX / 2;
  const cornerZ = totalZ / 2;
  const wallInteriorZ = cornerZ - wallBrickWidth / 2;
  const kitchenStartX = cornerX - wallBrickWidth / 2;
  const kitchenEndX = kitchenStartX - K.length;
  const cabinetFrontZ = wallInteriorZ - K.depth;

  const counterTopY = fndTop + K.height;
  const counterUndersideY = counterTopY - K.counterThick;

  // Layout walk: divider, slot, divider, slot, ..., divider
  const slotInfo = []; // {idx, centerX, w, type, h}
  const dividerInfo = []; // {centerX, w}
  let cursorX = kitchenStartX;
  for (let i = 0; i < slotCount; i++) {
    dividerInfo.push({ centerX: cursorX - dividerWidth / 2, w: dividerWidth });
    cursorX -= dividerWidth;
    const w = moduleWidths[i];
    const type = slotTypes[i];
    slotInfo.push({
      idx: i + 1,
      centerX: cursorX - w / 2,
      w,
      type,
      h: (type === 0 ? 0 : modSize(type).h)
    });
    cursorX -= w;
  }
  dividerInfo.push({ centerX: cursorX - dividerWidth / 2, w: dividerWidth });

  // ============== BRICK BASE ==============
  const stepL = brickLength + mortarGap;
  const stepH = brickHeight + mortarGap;
  const baseHeight = counterUndersideY - fndTop;
  const courses = Math.max(0, Math.floor(baseHeight / stepH));

  if (courses > 0) {
    const divBricksPerCourse = Math.ceil(K.depth / stepL) + 2;
    const kickBricksPerCourse = Math.ceil(0.79 / stepL) + 2;
    const maxBricks = (slotCount + 1) * courses * divBricksPerCourse
                    + slotCount * courses * kickBricksPerCourse
                    + slotCount * kickBricksPerCourse + 200;

    const brickGeo = new THREE.BoxGeometry(1, 1, 1);
    const brickMatI = new THREE.MeshStandardMaterial({ roughness: 0.82 });
    const mesh = new THREE.InstancedMesh(brickGeo, brickMatI, maxBricks);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const mat4 = new THREE.Matrix4();
    const pos = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const scl = new THREE.Vector3();
    const color = new THREE.Color();
    let idx = 0;

    function setColor() {
      color.setHSL(0.055 + Math.random()*0.025, 0.65 + Math.random()*0.15, 0.32 + Math.random()*0.1);
      mesh.setColorAt(idx, color);
    }

    // DIVIDERS — vertical brick walls between slots and at both ends
    for (const d of dividerInfo) {
      for (let c = 0; c < courses; c++) {
        const y = fndTop + c * stepH + brickHeight / 2;
        const off = (c % 2 === 1) ? stepL / 2 : 0;
        let z = wallInteriorZ - off;
        while (z - brickLength / 2 > cabinetFrontZ - stepL) {
          let bL = brickLength;
          let bz = z - brickLength / 2;
          if (bz + bL > wallInteriorZ) bL = wallInteriorZ - bz;
          if (bz < cabinetFrontZ) { bL -= (cabinetFrontZ - bz); bz = cabinetFrontZ; }
          if (bL < mortarGap) { z -= stepL; continue; }
          pos.set(d.centerX, y, bz + bL / 2);
          scl.set(d.w, brickHeight, bL);
          mat4.compose(pos, quat, scl);
          mesh.setMatrixAt(idx, mat4);
          setColor();
          idx++;
          z -= stepL;
        }
      }
    }

    // KICKBOARDS — front-face brick under and above each non-open module.
    // Drawer3 (type 3) and trash (type 2) modules sit on a 2-brick-course base
    // (moduleBottomY = fndTop + 2*stepH), with a single brick course centered
    // between the module top and the counter underside. Real-life build would
    // need a steel lintel spanning the slot; the brick course above is visual only.
    for (const s of slotInfo) {
      if (s.type === 0) continue;
      const { moduleBottomY, moduleTopY } = slotVerticalBounds(s, fndTop, counterUndersideY, stepH);
      const kickAbsoluteH = moduleBottomY - fndTop;
      const leftX = s.centerX + s.w / 2;
      const rightX = s.centerX - s.w / 2;
      const layCourse = (y, cidx) => {
        const off = (cidx % 2 === 1) ? stepL / 2 : 0;
        let x = leftX - off;
        while (x - brickLength / 2 > rightX - stepL) {
          let bL = brickLength;
          let bx = x - brickLength / 2;
          if (bx + bL > leftX) bL = leftX - bx;
          if (bx < rightX) { bL -= (rightX - bx); bx = rightX; }
          if (bL < mortarGap) { x -= stepL; continue; }
          pos.set(bx + bL / 2, y, cabinetFrontZ + dividerThickness / 2);
          scl.set(bL, brickHeight, dividerThickness);
          mat4.compose(pos, quat, scl);
          mesh.setMatrixAt(idx, mat4);
          setColor();
          idx++;
          x -= stepL;
        }
      };
      if (kickAbsoluteH >= stepH) {
        const kickCourses = Math.floor(kickAbsoluteH / stepH);
        for (let c = 0; c < kickCourses; c++) {
          layCourse(fndTop + c * stepH + brickHeight / 2, c);
        }
      }
      // Top course above drawer3 and trash — single course centered in the gap.
      const topGap = counterUndersideY - moduleTopY;
      if (topGap > 0.001 && (s.type === 2 || s.type === 3)) {
        const topCourseY = (moduleTopY + counterUndersideY) / 2;
        const topCidx = Math.floor((moduleTopY - fndTop) / stepH);
        layCourse(topCourseY, topCidx);
      }
    }

    mesh.count = idx;
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    gBricks.add(mesh);
  }

  // ============== COUNTER ==============
  // Tessellated around the sink rim cutout so the basin renders properly.
  const counterW = K.length + 2 * K.counterOverhang;
  const counterD = K.depth + K.counterOverhang;
  const counterCX = (kitchenStartX + kitchenEndX) / 2;
  const counterCZ = wallInteriorZ - counterD / 2;
  const counterY = counterUndersideY + K.counterThick / 2;
  const counterXmin = counterCX - counterW / 2;
  const counterXmax = counterCX + counterW / 2;
  const counterZmin = wallInteriorZ - counterD;
  const counterZmax = wallInteriorZ;

  const sinkCutW = SINK_RIMS[sinkModelIdx].w;
  const sinkCutD = Math.min(SINK_RIMS[sinkModelIdx].d, K.depth - 0.02);
  const sinkCutCx = slotInfo[sinkSlotIdx0].centerX;
  const sinkCutCz = wallInteriorZ - K.depth / 2;
  const cutXmin = Math.max(sinkCutCx - sinkCutW / 2, counterXmin);
  const cutXmax = Math.min(sinkCutCx + sinkCutW / 2, counterXmax);
  const cutZmin = Math.max(sinkCutCz - sinkCutD / 2, counterZmin);
  const cutZmax = Math.min(sinkCutCz + sinkCutD / 2, counterZmax);
  const hasCutout = cutXmax - cutXmin > 0.001 && cutZmax - cutZmin > 0.001;

  if (!hasCutout) {
    box(g, counterMat, counterW, K.counterThick, counterD, counterCX, counterY, counterCZ);
  } else {
    // Left strip (full depth)
    if (cutXmin - counterXmin > 0.001) {
      box(g, counterMat, cutXmin - counterXmin, K.counterThick, counterD,
          (counterXmin + cutXmin) / 2, counterY, counterCZ);
    }
    // Right strip (full depth)
    if (counterXmax - cutXmax > 0.001) {
      box(g, counterMat, counterXmax - cutXmax, K.counterThick, counterD,
          (cutXmax + counterXmax) / 2, counterY, counterCZ);
    }
    // Front strip (between counter front and sink front)
    if (cutZmin - counterZmin > 0.001) {
      box(g, counterMat, cutXmax - cutXmin, K.counterThick, cutZmin - counterZmin,
          (cutXmin + cutXmax) / 2, counterY, (counterZmin + cutZmin) / 2);
    }
    // Back strip (between sink back and counter back/wall interior)
    if (counterZmax - cutZmax > 0.001) {
      box(g, counterMat, cutXmax - cutXmin, K.counterThick, counterZmax - cutZmax,
          (cutXmin + cutXmax) / 2, counterY, (cutZmax + counterZmax) / 2);
    }
  }

  // ============== MODULE FRONT FACES ==============
  // Face plate sits a hair in front of the brick front face (cabinetFrontZ)
  const faceZ = cabinetFrontZ - 0.006;
  for (const s of slotInfo) {
    if (s.type === 0) continue;
    const { moduleBottomY, moduleTopY } = slotVerticalBounds(s, fndTop, counterUndersideY, stepH);
    const cy = (moduleTopY + moduleBottomY) / 2;
    // Stainless face plates use fixed product dimensions (not scaled to slot width).
    const mod = modSize(s.type);
    if (s.type === 1) buildModDoor(g, s.centerX, cy, faceZ, mod.w, mod.h);
    else if (s.type === 2) buildModTrash(g, s.centerX, cy, faceZ, mod);
    else if (s.type === 3) buildModDrawer3(g, s.centerX, cy, faceZ, mod);
  }

  // ============== SINK + HOB ==============
  buildSink(g, sinkModelIdx, slotInfo[sinkSlotIdx0].centerX, counterTopY, K.depth, wallInteriorZ);

  const hobSlotIdx = Math.max(1, Math.min(slotCount, Math.round(K.hobSlot))) - 1;
  buildHob(g, Math.round(K.hobModel), slotInfo[hobSlotIdx].centerX, counterTopY, K.depth, wallInteriorZ);

  // ============== LIGHT ==============
  const kitchenLight = new THREE.PointLight(0xFFF0DD, 0.5, 4);
  kitchenLight.position.set(counterCX, counterTopY + 0.6, wallInteriorZ - 0.05);
  g.add(kitchenLight);

  // Update HUD when viewing the kitchen tab
  if (currentTab === 'kitchen') {
    const sinkNames = ['Naya 8', 'Zia 8S', 'Eridan'];
    const hobNames  = ['Electric', 'Gas'];
    const dCount = slotTypes.filter(t => t === 3).length;
    const tCount = slotTypes.filter(t => t === 2).length;
    const doorCount = slotTypes.filter(t => t === 1).length;
    const warn = layoutWarning ? ` | <span style="color:#ff8a4c">⚠ ${layoutWarning}</span>` : '';
    document.getElementById('stats').innerHTML =
      `Kitchen ${K.length.toFixed(2)}×${K.depth.toFixed(2)}m | ` +
      `Sink: ${sinkNames[Math.round(K.sinkModel)] || '?'} (slot ${sinkSlotIdx0 + 1}) | ` +
      `Hob: ${hobNames[Math.round(K.hobModel)] || '?'} (slot ${hobSlotIdx + 1}) | ` +
      `Doors:${doorCount} Trash:${tCount} 3-Drawers:${dCount}${warn}`;
  }
}

// ── Built-in module front faces (VEVOR-style stainless steel) ──

function buildModDoor(g, cx, cy, faceZ, w, h) {
  const frameT = 0.012;
  const inset  = 0.022;
  const seam   = 0.003;
  const panelW = (w - seam) / 2;
  const handleH = Math.min(0.16, h * 0.25);
  for (const side of [-1, 1]) {
    const panelCx = cx + side * (panelW + seam) / 2;
    // Outer frame (top/bottom/left/right strips), slightly raised
    box(g, stainlessMat, panelW, frameT, 0.012, panelCx, cy + h/2 - frameT/2, faceZ);
    box(g, stainlessMat, panelW, frameT, 0.012, panelCx, cy - h/2 + frameT/2, faceZ);
    box(g, stainlessMat, frameT, h - 2*frameT, 0.012, panelCx + panelW/2 - frameT/2, cy, faceZ);
    box(g, stainlessMat, frameT, h - 2*frameT, 0.012, panelCx - panelW/2 + frameT/2, cy, faceZ);
    // Inner recessed panel (sits slightly behind the frame face)
    box(g, stainlessMat, panelW - 2*inset, h - 2*inset, 0.008, panelCx, cy, faceZ + 0.004);
    // Vertical handle near the center seam (inner edge of each door)
    const handleX = panelCx - side * (panelW/2 - 0.05);
    box(g, stainlessDark, 0.018, handleH, 0.028,
        handleX, cy + h/2 - 0.10 - handleH/2, faceZ - 0.018);
  }
}

// Open-top stainless tray body for a single drawer.
// Front face plate is already drawn at faceZ by the caller.
function buildDrawerBody(g, cx, cy, faceZ, w, h, d) {
  if (d <= 0) return;
  const wallT = 0.012;
  const bodyFrontZ = faceZ + 0.007; // just behind the 14mm face plate
  const bodyCz = bodyFrontZ + d / 2;
  const bodyBackZ = bodyFrontZ + d;
  const innerW = w - 2 * wallT;
  // Bottom
  box(g, cabinetMat, innerW, wallT, d,
      cx, cy - h / 2 + wallT / 2, bodyCz);
  // Back
  box(g, cabinetMat, innerW, h - wallT, wallT,
      cx, cy + wallT / 2, bodyBackZ - wallT / 2);
  // Left
  box(g, cabinetMat, wallT, h, d,
      cx - w / 2 + wallT / 2, cy, bodyCz);
  // Right
  box(g, cabinetMat, wallT, h, d,
      cx + w / 2 - wallT / 2, cy, bodyCz);
}

// Stainless trim flange — 4 strips forming a rectangle frame around the cutout.
// Mounted slightly forward of the face plate to overlap the surrounding brick edges.
function buildTrimFlange(g, cx, cy, faceZ, outerW, outerH, cutW, cutH) {
  const sideT = (outerW - cutW) / 2;
  const vertT = (outerH - cutH) / 2;
  const z = faceZ - 0.002; // 2mm in front of face plate
  if (vertT > 0.001) {
    box(g, stainlessMat, outerW, vertT, 0.006, cx, cy + outerH/2 - vertT/2, z);
    box(g, stainlessMat, outerW, vertT, 0.006, cx, cy - outerH/2 + vertT/2, z);
  }
  if (sideT > 0.001) {
    box(g, stainlessMat, sideT, cutH, 0.006, cx - outerW/2 + sideT/2, cy, z);
    box(g, stainlessMat, sideT, cutH, 0.006, cx + outerW/2 - sideT/2, cy, z);
  }
}

function buildModTrash(g, cx, cy, faceZ, mod) {
  buildTrimFlange(g, cx, cy, faceZ, mod.w, mod.h, mod.cutW, mod.cutH);
  const w = mod.cutW;
  const h = mod.cutH;
  // Single drawer face inside the cutout
  box(g, stainlessMat, w, h, 0.014, cx, cy, faceZ);
  // Horizontal 5" bar handle centered
  const handleW = Math.min(0.127, w * 0.7);
  box(g, stainlessDark, handleW, 0.014, 0.026, cx, cy, faceZ - 0.016);
  box(g, stainlessDark, 0.009, 0.018, 0.022, cx - handleW/2, cy, faceZ - 0.011);
  box(g, stainlessDark, 0.009, 0.018, 0.022, cx + handleW/2, cy, faceZ - 0.011);
  // Drawer body extending back at cutout dimensions
  buildDrawerBody(g, cx, cy, faceZ, w, h, mod.d);
}

function buildModDrawer3(g, cx, cy, faceZ, mod) {
  buildTrimFlange(g, cx, cy, faceZ, mod.w, mod.h, mod.cutW, mod.cutH);
  const w = mod.cutW;
  const h = mod.cutH;
  const seam = 0.0025;
  const drawerH = h / 3;
  const faceH = drawerH - seam;
  for (let i = 0; i < 3; i++) {
    const dCy = cy + h/2 - drawerH * (i + 0.5);
    // Drawer face inside the cutout
    box(g, stainlessMat, w, faceH, 0.014, cx, dCy, faceZ);
    // Handle on this drawer
    const handleW = Math.min(0.127, w * 0.55);
    box(g, stainlessDark, handleW, 0.012, 0.022, cx, dCy, faceZ - 0.015);
    box(g, stainlessDark, 0.008, 0.016, 0.020, cx - handleW/2, dCy, faceZ - 0.011);
    box(g, stainlessDark, 0.008, 0.016, 0.020, cx + handleW/2, dCy, faceZ - 0.011);
    // Drawer body for this drawer (3 stacked open-top trays)
    buildDrawerBody(g, cx, dCy, faceZ, w, faceH, mod.d);
  }
}

// ── Switchable sink models ──
function buildSink(g, model, cx, counterTopY, kDepth, wallInteriorZ) {
  let rimW = SINK_RIMS[model].w;
  let rimD = SINK_RIMS[model].d;
  let rimMat, bowlMat, bowls;
  if (model === 0) {
    // Blanco Naya 8 — 815 × 500 mm, large + small bowls (composite)
    rimMat = sinkNayaMat; bowlMat = sinkNayaBasin;
    bowls = [
      { ox:  0.155, oz: 0, bw: 0.43,  bd: 0.44,  depth: 0.20 },
      { ox: -0.225, oz: 0, bw: 0.372, bd: 0.272, depth: 0.20 }
    ];
  } else if (model === 1) {
    // Blanco Zia 8S — 1160 × 500 mm, two symmetric bowls
    rimMat = sinkZiaMat; bowlMat = sinkZiaBasin;
    bowls = [
      { ox:  0.27, oz: 0, bw: 0.45, bd: 0.338, depth: 0.19 },
      { ox: -0.27, oz: 0, bw: 0.45, bd: 0.338, depth: 0.19 }
    ];
  } else {
    // Deante Eridan — 880 × 500 mm anthracite, large + small bowls
    rimMat = sinkEridanMat; bowlMat = sinkEridanBasin;
    bowls = [
      { ox: -0.16,  oz: 0, bw: 0.495, bd: 0.43, depth: 0.19 },
      { ox:  0.255, oz: 0, bw: 0.35,  bd: 0.26, depth: 0.19 }
    ];
  }
  // Don't let sink hang off the back of the counter
  rimD = Math.min(rimD, kDepth - 0.02);

  const cz = wallInteriorZ - kDepth / 2;
  const rimY = counterTopY + 0.006;
  const rimXmin = -rimW / 2, rimXmax = rimW / 2;
  const rimZmin = -rimD / 2, rimZmax = rimD / 2;

  // Rim plate — tessellated into strips around each bowl cutout
  // 1. Full-depth X-strips between bowls (sorted by ox)
  const sortedBowls = [...bowls].sort((a, b) => a.ox - b.ox);
  let prevX = rimXmin;
  for (const b of sortedBowls) {
    const bxMin = Math.max(b.ox - b.bw / 2, rimXmin);
    const stripW = bxMin - prevX;
    if (stripW > 0.001) {
      box(g, rimMat, stripW, 0.012, rimD, cx + (prevX + bxMin) / 2, rimY, cz);
    }
    prevX = Math.min(b.ox + b.bw / 2, rimXmax);
  }
  if (rimXmax - prevX > 0.001) {
    box(g, rimMat, rimXmax - prevX, 0.012, rimD, cx + (prevX + rimXmax) / 2, rimY, cz);
  }
  // 2. Front/back strips per bowl (clipped to rim bounds)
  for (const b of bowls) {
    const bxMin = Math.max(b.ox - b.bw / 2, rimXmin);
    const bxMax = Math.min(b.ox + b.bw / 2, rimXmax);
    const bzMin = Math.max(b.oz - b.bd / 2, rimZmin);
    const bzMax = Math.min(b.oz + b.bd / 2, rimZmax);
    const clippedBw = bxMax - bxMin;
    if (clippedBw < 0.001) continue;
    const clippedCx = (bxMin + bxMax) / 2;
    if (rimZmax - bzMax > 0.001) {
      box(g, rimMat, clippedBw, 0.012, rimZmax - bzMax,
          cx + clippedCx, rimY, cz + (bzMax + rimZmax) / 2);
    }
    if (bzMin - rimZmin > 0.001) {
      box(g, rimMat, clippedBw, 0.012, bzMin - rimZmin,
          cx + clippedCx, rimY, cz + (rimZmin + bzMin) / 2);
    }
  }

  // Hollow wells — 4 side walls + floor per bowl
  const wallT = 0.006, floorT = 0.006;
  for (const b of bowls) {
    const bx = cx + b.ox;
    const bz = cz + b.oz;
    const wellTopY = rimY - 0.006;
    const wellY = wellTopY - b.depth / 2;
    box(g, bowlMat, b.bw, b.depth, wallT, bx, wellY, bz - b.bd / 2 + wallT / 2);
    box(g, bowlMat, b.bw, b.depth, wallT, bx, wellY, bz + b.bd / 2 - wallT / 2);
    box(g, bowlMat, wallT, b.depth, b.bd - 2 * wallT, bx - b.bw / 2 + wallT / 2, wellY, bz);
    box(g, bowlMat, wallT, b.depth, b.bd - 2 * wallT, bx + b.bw / 2 - wallT / 2, wellY, bz);
    box(g, bowlMat, b.bw - 2 * wallT, floorT, b.bd - 2 * wallT,
        bx, wellTopY - b.depth + floorT / 2, bz);
  }

  // Faucet — anchored on the back-deck strip behind the deepest-back bowl
  const maxBowlZmax = Math.max(...bowls.map(b => b.oz + b.bd / 2));
  const faucetX = cx + (model === 2 ? -0.16 : (model === 0 ? 0.155 : 0));
  const faucetZ = cz + (maxBowlZmax + rimZmax) / 2;
  const colH = 0.28;
  box(g, stainlessMat, 0.025, colH, 0.025, faucetX, rimY + colH / 2, faucetZ);
  // Horizontal spout reaching toward the bowl
  box(g, stainlessMat, 0.025, 0.025, 0.16, faucetX, rimY + colH - 0.012, faucetZ - 0.08);
  // Small joystick handle on the side of the column
  box(g, stainlessDark, 0.045, 0.05, 0.022, faucetX + 0.025, rimY + colH - 0.05, faucetZ);
}

// ── Switchable hob models ──
function buildHob(g, model, cx, counterTopY, kDepth, wallInteriorZ) {
  const w = 0.59;
  const d = Math.min(0.52, kDepth - 0.06);
  const cz = wallInteriorZ - kDepth / 2;
  const panelY = counterTopY + 0.006;

  if (model === 0) {
    // Electric ceramic — Bosch ET611HE17E. Smooth black glass, 4 dark heating zones, no knobs.
    box(g, glassHobMat, w, 0.010, d, cx, panelY, cz);
    const zoneR = 0.075;
    const zoneMat = new THREE.MeshStandardMaterial({ color: 0x1A1A1F, metalness: 0.10, roughness: 0.25 });
    const zoneRingMat = new THREE.MeshStandardMaterial({ color: 0x5A5050, metalness: 0.05, roughness: 0.45 });
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 2; c++) {
        const zx = cx + (c - 0.5) * w * 0.42;
        const zz = cz + (r - 0.5) * d * 0.42;
        // Dark filled disk
        const disk = new THREE.Mesh(new THREE.CircleGeometry(zoneR, 32), zoneMat);
        disk.position.set(zx, panelY + 0.0056, zz);
        disk.rotation.x = -Math.PI / 2;
        disk.receiveShadow = true;
        g.add(disk);
        // Subtle outer ring
        const ring = new THREE.Mesh(new THREE.RingGeometry(zoneR + 0.003, zoneR + 0.006, 48), zoneRingMat);
        ring.position.set(zx, panelY + 0.0057, zz);
        ring.rotation.x = -Math.PI / 2;
        g.add(ring);
      }
    }
  } else {
    // Gas — Bosch PKM631BB2E. Matte panel + 4 burner caps + cast-iron cross-grates + 4 front knobs.
    box(g, hobMatteMat, w, 0.010, d, cx, panelY, cz);
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 2; c++) {
        const bx = cx + (c - 0.5) * w * 0.42;
        const bz = cz + (r - 0.5) * d * 0.42;
        // Burner cap (low cylinder)
        const cap = new THREE.Mesh(
          new THREE.CylinderGeometry(0.040, 0.045, 0.014, 18),
          hobBurnerMat);
        cap.position.set(bx, panelY + 0.011, bz);
        cap.castShadow = true; cap.receiveShadow = true;
        g.add(cap);
        // Cross-bar grate sitting above
        const grateSize = 0.10;
        const barH = 0.014;
        const barT = 0.012;
        const by = panelY + 0.024;
        box(g, hobBurnerMat, grateSize, barH, barT, bx, by, bz);
        box(g, hobBurnerMat, barT, barH, grateSize, bx, by, bz);
      }
    }
    // 4 stainless knobs across the front edge
    for (let k = 0; k < 4; k++) {
      const kx = cx + (k - 1.5) * w * 0.18;
      const kz = cz - d / 2 + 0.030;
      const knob = new THREE.Mesh(
        new THREE.CylinderGeometry(0.013, 0.013, 0.020, 18),
        hobKnobMat);
      knob.position.set(kx, panelY + 0.015, kz);
      knob.rotation.x = Math.PI / 2;
      knob.castShadow = true; knob.receiveShadow = true;
      g.add(knob);
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// KITCHEN BACKDROP — slab + stub brick wall (visible only in kitchen tab)
// ═══════════════════════════════════════════════════════════════
function buildKitchenBackdrop() {
  clearGroup('kitchenBackdrop');
  clearGroup('kitchenSlab');
  const gWall = groups.kitchenBackdrop;
  const gSlab = groups.kitchenSlab;

  const K = CONFIG.kitchen;
  const {brickLength, brickHeight, mortarGap, wallHeight} = CONFIG.brickWall;
  const wallBrickWidth = CONFIG.brickWall.brickWidth;
  const fndTop = CONFIG.foundation.thickness;
  const fndThick = CONFIG.foundation.thickness;
  if (K.length <= 0 || K.depth <= 0) return;

  const {totalX, totalZ} = getPostGridDimensions();
  const cornerX = totalX / 2;
  const cornerZ = totalZ / 2;
  const wallInteriorZ = cornerZ - wallBrickWidth / 2;
  const kitchenStartX = cornerX - wallBrickWidth / 2;
  const kitchenEndX = kitchenStartX - K.length;
  const kitchenCX = (kitchenStartX + kitchenEndX) / 2;

  // SLAB — concrete pad under and around the kitchen
  const slabMarginSide = 0.6;
  const slabMarginFront = 1.2;
  const slabMarginBack = 0.3;
  const slabW = K.length + slabMarginSide * 2;
  const slabD = K.depth + slabMarginFront + slabMarginBack;
  const slabCZ = (wallInteriorZ + slabMarginBack) - slabD / 2;
  box(gSlab, concreteMat, slabW, fndThick, slabD, kitchenCX, fndThick / 2, slabCZ);

  // BRICK WALL behind the kitchen — running bond, same palette as pavilion brick wall
  const stepL = brickLength + mortarGap;
  const stepH = brickHeight + mortarGap;
  const wallCourses = Math.max(0, Math.floor(wallHeight / stepH));
  if (wallCourses === 0) return;

  const wallSpan = K.length + 1.6;
  const wallLeftX = kitchenCX - wallSpan / 2;
  const wallRightX = kitchenCX + wallSpan / 2;
  const wallZ = cornerZ; // same Z as pavilion brick back wall centerline

  const bricksPerCourse = Math.ceil(wallSpan / stepL) + 2;
  const maxBricks = wallCourses * bricksPerCourse + 50;
  const brickGeo = new THREE.BoxGeometry(1, 1, 1);
  const brickMatI = new THREE.MeshStandardMaterial({ roughness: 0.82 });
  const mesh = new THREE.InstancedMesh(brickGeo, brickMatI, maxBricks);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  const mat4 = new THREE.Matrix4();
  const pos = new THREE.Vector3();
  const quat = new THREE.Quaternion();
  const scl = new THREE.Vector3();
  const color = new THREE.Color();
  let idx = 0;

  for (let c = 0; c < wallCourses; c++) {
    const y = fndTop + c * stepH + brickHeight / 2;
    const off = (c % 2 === 1) ? stepL / 2 : 0;
    let x = wallLeftX - off;
    while (x < wallRightX + stepL) {
      let bL = brickLength;
      let bx = x;
      if (bx + bL > wallRightX) bL = wallRightX - bx;
      if (bx < wallLeftX) { bL -= (wallLeftX - bx); bx = wallLeftX; }
      if (bL < mortarGap) { x += stepL; continue; }
      pos.set(bx + bL / 2, y, wallZ);
      scl.set(bL, brickHeight, wallBrickWidth);
      mat4.compose(pos, quat, scl);
      mesh.setMatrixAt(idx, mat4);
      color.setHSL(0.055 + Math.random()*0.025, 0.65 + Math.random()*0.15, 0.32 + Math.random()*0.1);
      mesh.setColorAt(idx, color);
      idx++;
      x += stepL;
    }
  }
  mesh.count = idx;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  gWall.add(mesh);
}

// ═══════════════════════════════════════════════════════════════
// FENCE
// ═══════════════════════════════════════════════════════════════
function buildFence() {
  clearGroup('fence');
  const g = groups.fence;
  const {height, picketWidth, picketThickness, picketGap, railHeight, railDepth, railInset,
         frontOpening, leftOpening} = CONFIG.fence;
  const postSize = CONFIG.posts.size;
  const fndTop = CONFIG.foundation.thickness;
  const segments = getFenceSegments();

  segments.forEach(seg => {
    // Skip openings
    if (seg.side === 'front' && frontOpening > 0 && seg.sideIndex === frontOpening) return;
    if (seg.side === 'left'  && leftOpening > 0  && seg.sideIndex === leftOpening) return;

    const dx = seg.x2 - seg.x1;
    const dz = seg.z2 - seg.z1;
    const isAlongX = Math.abs(dx) > Math.abs(dz);

    // Compute effective start/end with insets from posts
    let startInset = seg.postStart ? postSize / 2 : 0;
    let endInset   = seg.postEnd   ? postSize / 2 : 0;

    let sx, sz, ex, ez;
    if (isAlongX) {
      sx = seg.x1 + (dx > 0 ? startInset : -startInset);
      ex = seg.x2 + (dx > 0 ? -endInset : endInset);
      sz = seg.z1; ez = seg.z2;
    } else {
      sz = seg.z1 + (dz > 0 ? startInset : -startInset);
      ez = seg.z2 + (dz > 0 ? -endInset : endInset);
      sx = seg.x1; ex = seg.x2;
    }

    const spanLen = Math.sqrt((ex - sx) ** 2 + (ez - sz) ** 2);
    if (spanLen < 0.05) return;

    const midX = (sx + ex) / 2;
    const midZ = (sz + ez) / 2;

    // Rails
    const bottomRailY = fndTop + railInset + railHeight / 2;
    const topRailY    = fndTop + height - railInset + railHeight / 2;

    if (isAlongX) {
      box(g, woodMat, spanLen, railHeight, railDepth, midX, bottomRailY, midZ);
      box(g, woodMat, spanLen, railHeight, railDepth, midX, topRailY, midZ);
    } else {
      box(g, woodMat, railDepth, railHeight, spanLen, midX, bottomRailY, midZ);
      box(g, woodMat, railDepth, railHeight, spanLen, midX, topRailY, midZ);
    }

    // Pickets
    const step = picketWidth + picketGap;
    const numPickets = Math.max(1, Math.floor(spanLen / step));
    const actualSpan = numPickets * step - picketGap;
    const offset = (spanLen - actualSpan) / 2;

    for (let i = 0; i < numPickets; i++) {
      const t = offset + i * step + picketWidth / 2;
      const frac = t / spanLen;
      const px = sx + (ex - sx) * frac;
      const pz = sz + (ez - sz) * frac;
      const py = fndTop + height / 2;

      if (isAlongX) {
        box(g, woodMat, picketWidth, height, picketThickness, px, py, pz);
      } else {
        box(g, woodMat, picketThickness, height, picketWidth, px, py, pz);
      }
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// FURNITURE (L-shaped sofa + coffee table, dining table + 6 chairs)
// ═══════════════════════════════════════════════════════════════
function buildFurniture() {
  clearGroup('furniture');
  if (CONFIG.furniture.show < 1) return;

  const g = groups.furniture;
  const F = CONFIG.furniture;
  const {totalX, totalZ} = getPostGridDimensions();
  const baseY = CONFIG.foundation.thickness;

  // ════════════════════════════════════════════════════════════
  // L-SHAPED SOFA + COFFEE TABLE  (front-left corner, -X -Z)
  // ════════════════════════════════════════════════════════════
  const cx = -totalX/2 + F.sofaCornerOffsetX;
  const cz = -totalZ/2 + F.sofaCornerOffsetZ;

  const legH = F.sofaFrameHeight;
  const r = F.sofaFrameRail;
  const seatY = baseY + legH + r;
  const cushTopY = seatY + F.sofaCushionThick;
  const backBotY = cushTopY;
  const railY = baseY + legH + r/2;

  if (F.sofaType === 2) {
    // ── CHAISE SECTIONAL: 3-seat body along X with chaise extension ──
    const L = F.sofa2Length;
    const bD = F.sofa2BodyDepth;
    const cD = Math.max(0, F.sofa2ChaiseDepth - F.sofa2BodyDepth);
    const cW = Math.min(F.sofa2ChaiseWidth, L);
    const right = F.sofa2ChaiseSide >= 1;

    const bx1 = cx + L;
    const bz1 = cz + bD;
    const bCX = cx + L/2;
    const bCZ = cz + bD/2;

    const ccx0 = right ? (bx1 - cW) : cx;
    const ccx1 = ccx0 + cW;
    const ccz1 = bz1 + cD;

    // Body: 4 corner legs
    box(g, acaciaMat, r, legH, r, cx,  baseY+legH/2, cz);
    box(g, acaciaMat, r, legH, r, bx1, baseY+legH/2, cz);
    box(g, acaciaMat, r, legH, r, cx,  baseY+legH/2, bz1);
    box(g, acaciaMat, r, legH, r, bx1, baseY+legH/2, bz1);

    // Body: 4 frame rails
    box(g, acaciaMat, L, r, r, bCX, railY, cz);
    box(g, acaciaMat, L, r, r, bCX, railY, bz1);
    box(g, acaciaMat, r, r, bD, cx,  railY, bCZ);
    box(g, acaciaMat, r, r, bD, bx1, railY, bCZ);

    // Body: seat cushion
    box(g, cushionMat, L, F.sofaCushionThick, bD, bCX, seatY+F.sofaCushionThick/2, bCZ);

    // Body: backrest along -Z edge (full length)
    box(g, cushionMat, L, F.sofaBackHeight, F.sofaBackThick,
        bCX, backBotY+F.sofaBackHeight/2, cz+F.sofaBackThick/2);

    // Body: single armrest on the non-chaise end
    const armH = F.sofaBackHeight * 0.6;
    const armCX = right ? cx + F.sofaBackThick/2 : bx1 - F.sofaBackThick/2;
    box(g, cushionMat, F.sofaBackThick, armH, bD,
        armCX, cushTopY + armH/2, bCZ);

    // Chaise extension
    if (cD > 0) {
      const cCX = (ccx0 + ccx1)/2;
      const cCZ = (bz1 + ccz1)/2;

      // 2 outer-corner legs
      box(g, acaciaMat, r, legH, r, ccx0, baseY+legH/2, ccz1);
      box(g, acaciaMat, r, legH, r, ccx1, baseY+legH/2, ccz1);
      // Inner-end leg only where it doesn't coincide with a body leg
      if (right) box(g, acaciaMat, r, legH, r, ccx0, baseY+legH/2, bz1);
      else       box(g, acaciaMat, r, legH, r, ccx1, baseY+legH/2, bz1);

      // 3 frame rails (front + 2 sides; back rail shared with body)
      box(g, acaciaMat, cW, r, r, cCX, railY, ccz1);
      box(g, acaciaMat, r, r, cD, ccx0, railY, cCZ);
      box(g, acaciaMat, r, r, cD, ccx1, railY, cCZ);

      // Chaise seat cushion (flush with body cushion)
      box(g, cushionMat, cW, F.sofaCushionThick, cD,
          cCX, seatY+F.sofaCushionThick/2, cCZ);
    }
  } else {
    // ── L-SHAPED SOFA (sofaType === 1) ──
    // ── ARM A: runs along +X from corner, along the -Z edge ──
    const aLen = F.sofaArmLength;
    const aDepth = F.sofaSeatDepth;
    const aCX = cx + aLen/2;
    const aCZ = cz + aDepth/2;

    // 4 legs
    box(g, acaciaMat, r, legH, r, cx,      baseY+legH/2, cz);
    box(g, acaciaMat, r, legH, r, cx+aLen, baseY+legH/2, cz);
    box(g, acaciaMat, r, legH, r, cx,      baseY+legH/2, cz+aDepth);
    box(g, acaciaMat, r, legH, r, cx+aLen, baseY+legH/2, cz+aDepth);

    // 4 frame rails
    box(g, acaciaMat, aLen, r, r, aCX, railY, cz);
    box(g, acaciaMat, aLen, r, r, aCX, railY, cz+aDepth);
    box(g, acaciaMat, r, r, aDepth, cx,      railY, aCZ);
    box(g, acaciaMat, r, r, aDepth, cx+aLen, railY, aCZ);

    // Seat cushion
    box(g, cushionMat, aLen, F.sofaCushionThick, aDepth, aCX, seatY+F.sofaCushionThick/2, aCZ);

    // Backrest along outer -Z edge
    box(g, cushionMat, aLen, F.sofaBackHeight, F.sofaBackThick,
        aCX, backBotY+F.sofaBackHeight/2, cz+F.sofaBackThick/2);

    // ── ARM B: runs along +Z from corner, along the -X edge ──
    const bStartZ = cz + aDepth;
    const bLen = F.sofaArmLength - aDepth;
    const bDepth = F.sofaSeatDepth;
    const bCX = cx + bDepth/2;
    const bCZ = bStartZ + bLen/2;

    // 2 unique far legs
    box(g, acaciaMat, r, legH, r, cx,        baseY+legH/2, cz+F.sofaArmLength);
    box(g, acaciaMat, r, legH, r, cx+bDepth, baseY+legH/2, cz+F.sofaArmLength);
