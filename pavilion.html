    // 3 frame rails
    box(g, acaciaMat, r, r, bLen, cx,        railY, bCZ);
    box(g, acaciaMat, r, r, bLen, cx+bDepth, railY, bCZ);
    box(g, acaciaMat, bDepth, r, r, bCX,     railY, cz+F.sofaArmLength);

    // Seat cushion
    box(g, cushionMat, bDepth, F.sofaCushionThick, bLen, bCX, seatY+F.sofaCushionThick/2, bCZ);

    // Backrest along outer -X edge
    box(g, cushionMat, F.sofaBackThick, F.sofaBackHeight, bLen,
        cx+F.sofaBackThick/2, backBotY+F.sofaBackHeight/2, bCZ);
  }

  // ── COFFEE TABLE in the L opening ──
  const tableCX = cx + F.sofaSeatDepth + F.coffeTableOffset + F.coffeTableSize/2;
  const tableCZ = cz + F.sofaSeatDepth + F.coffeTableOffset + F.coffeTableSize/2;
  const tLeg = F.coffeTableLegSize;
  const tLegH = F.coffeTableHeight - F.coffeTableTopThick;
  const tHalf = F.coffeTableSize/2 - tLeg/2;

  // 4 legs
  box(g, acaciaMat, tLeg, tLegH, tLeg, tableCX-tHalf, baseY+tLegH/2, tableCZ-tHalf);
  box(g, acaciaMat, tLeg, tLegH, tLeg, tableCX+tHalf, baseY+tLegH/2, tableCZ-tHalf);
  box(g, acaciaMat, tLeg, tLegH, tLeg, tableCX-tHalf, baseY+tLegH/2, tableCZ+tHalf);
  box(g, acaciaMat, tLeg, tLegH, tLeg, tableCX+tHalf, baseY+tLegH/2, tableCZ+tHalf);

  // 4 frame rails under the top
  const tRailY = baseY + tLegH + tLeg/2;
  box(g, acaciaMat, F.coffeTableSize, tLeg, tLeg, tableCX, tRailY, tableCZ-tHalf);
  box(g, acaciaMat, F.coffeTableSize, tLeg, tLeg, tableCX, tRailY, tableCZ+tHalf);
  box(g, acaciaMat, tLeg, tLeg, F.coffeTableSize, tableCX-tHalf, tRailY, tableCZ);
  box(g, acaciaMat, tLeg, tLeg, F.coffeTableSize, tableCX+tHalf, tRailY, tableCZ);

  // Slatted top (~10 slats)
  const cSlatCount = 10;
  const cSlatGap = 0.008;
  const cTotalGap = (cSlatCount - 1) * cSlatGap;
  const cSlatW = (F.coffeTableSize - cTotalGap) / cSlatCount;
  const cTopY = baseY + F.coffeTableHeight - F.coffeTableTopThick/2;
  for (let i = 0; i < cSlatCount; i++) {
    const sx = tableCX - F.coffeTableSize/2 + cSlatW/2 + i * (cSlatW + cSlatGap);
    box(g, acaciaMat, cSlatW, F.coffeTableTopThick, F.coffeTableSize, sx, cTopY, tableCZ);
  }

  // ════════════════════════════════════════════════════════════
  // LOUNGE CHAIR (Nämmarö-style) — opposite the coffee table, facing sofa
  // ════════════════════════════════════════════════════════════
  if (F.loungeShow >= 1) {
    const lW = F.loungeWidth;
    const lD = F.loungeDepth;
    const lSeatH = F.loungeSeatH;
    const lTotalH = F.loungeTotalH;
    const lArmH = F.loungeArmH;
    const lFT = F.loungeFrameThick;
    const lST = F.loungeSlatThick;

    // Build into a local sub-group centered at origin, then position + rotate
    const lc = new THREE.Group();
    const lx0 = -lW/2, lx1 = lW/2;
    const lz0 = -lD/2, lz1 = lD/2;  // -Z = front (faces sofa)

    // 4 legs — front legs to seat height, back legs to total height
    const frontLegY = baseY + lSeatH/2;
    const backLegY  = baseY + lTotalH/2;
    box(lc, acaciaMat, lFT, lSeatH,  lFT, lx0, frontLegY, lz0);
    box(lc, acaciaMat, lFT, lSeatH,  lFT, lx1, frontLegY, lz0);
    box(lc, acaciaMat, lFT, lTotalH, lFT, lx0, backLegY,  lz1);
    box(lc, acaciaMat, lFT, lTotalH, lFT, lx1, backLegY,  lz1);

    // Seat frame rails
    const lRailY = baseY + lSeatH - lFT/2;
    box(lc, acaciaMat, lW,  lFT, lFT, 0,   lRailY, lz0);
    box(lc, acaciaMat, lW,  lFT, lFT, 0,   lRailY, lz1);
    box(lc, acaciaMat, lFT, lFT, lD,  lx0, lRailY, 0);
    box(lc, acaciaMat, lFT, lFT, lD,  lx1, lRailY, 0);

    // Slatted seat
    const lSeatGap = 0.008;
    const lSeatInner = lD - 2*lFT;
    const lSeatTotalGap = (F.loungeSeatSlats - 1) * lSeatGap;
    const lSeatSlatW = (lSeatInner - lSeatTotalGap) / F.loungeSeatSlats;
    const lSeatTopY = baseY + lSeatH + lST/2;
    const lSeatStartZ = lz0 + lFT + lSeatSlatW/2;
    for (let i = 0; i < F.loungeSeatSlats; i++) {
      const sz = lSeatStartZ + i * (lSeatSlatW + lSeatGap);
      box(lc, acaciaMat, lW - 2*lFT, lST, lSeatSlatW, 0, lSeatTopY, sz);
    }

    // Slatted back
    const lBackBottomY = baseY + lSeatH + lFT;
    const lBackTopY = baseY + lTotalH - lFT/2;
    const lBackSpan = lBackTopY - lBackBottomY;
    const lBackGap = 0.012;
    const lBackTotalGap = (F.loungeBackSlats - 1) * lBackGap;
    const lBackSlatH = (lBackSpan - lBackTotalGap) / F.loungeBackSlats;
    for (let i = 0; i < F.loungeBackSlats; i++) {
      const sy = lBackBottomY + lBackSlatH/2 + i * (lBackSlatH + lBackGap);
      box(lc, acaciaMat, lW - 2*lFT, lBackSlatH, lST, 0, sy, lz1 - lFT/2);
    }

    // Armrests
    const lArmTopY = baseY + lSeatH + lArmH;
    const lArmThick = 0.025;
    box(lc, acaciaMat, lFT*1.1, lArmThick, lD, lx0, lArmTopY, 0);
    box(lc, acaciaMat, lFT*1.1, lArmThick, lD, lx1, lArmTopY, 0);

    // Seat cushion on top of the slats
    if (F.loungeCushionThick > 0) {
      const lCushW = lW - 2*lFT - 0.02;
      const lCushD = lD - 2*lFT - 0.02;
      const lCushY = baseY + lSeatH + lST + F.loungeCushionThick/2;
      box(lc, cushionMat, lCushW, F.loungeCushionThick, lCushD, 0, lCushY, 0);
    }

    // Anchor + slight angle relative to coffee table
    const lcX = tableCX + F.loungeOffsetX;
    const lcZ = tableCZ + F.coffeTableSize/2 + F.loungeOffsetFromTable + lD/2;
    lc.position.set(lcX, 0, lcZ);
    lc.rotation.y = F.loungeAngle * Math.PI / 180;
    g.add(lc);
  }

  // ════════════════════════════════════════════════════════════
  // DINING TABLE + 6 CHAIRS  (front-right corner, +X -Z, long axis along Z)
  // ════════════════════════════════════════════════════════════
  const tcx = totalX/2 - F.diningCornerOffsetX - F.tableWidth/2;
  const tcz = -totalZ/2 + F.diningCornerOffsetZ + F.tableLength/2;

  // ── SLATTED TABLE TOP (slats run along Z) ──
  const dTotalGap = (F.slatCount - 1) * F.slatGap;
  const dSlatW = (F.tableLength - dTotalGap) / F.slatCount;
  const dTopY = baseY + F.tableHeight - F.tableTopThick / 2;
  for (let i = 0; i < F.slatCount; i++) {
    const sz = tcz - F.tableLength / 2 + dSlatW / 2 + i * (dSlatW + F.slatGap);
    box(g, acaciaMat, F.tableWidth, F.tableTopThick, dSlatW, tcx, dTopY, sz);
  }

  // ── APRON RAILS (under table top edges, along Z) ──
  const apronH = 0.04;
  const apronY = baseY + F.tableHeight - F.tableTopThick - apronH / 2;
  box(g, acaciaMat, 0.025, apronH, F.tableLength - 2 * F.legInsetX,
      tcx - F.tableWidth / 2 + 0.06, apronY, tcz);
  box(g, acaciaMat, 0.025, apronH, F.tableLength - 2 * F.legInsetX,
      tcx + F.tableWidth / 2 - 0.06, apronY, tcz);

  // ── SLED LEGS (2 U-shaped frames, one near each Z end) ──
  const dLegTopY = baseY + F.tableHeight - F.tableTopThick;
  const t = F.legTube;
  for (const sideZ of [-1, 1]) {
    const lz = tcz + sideZ * (F.tableLength / 2 - F.legInsetX);
    for (const sideX of [-1, 1]) {
      const lx = tcx + sideX * F.legFootWidth / 2;
      box(g, metalMat, t, dLegTopY - baseY, t, lx, baseY + (dLegTopY - baseY) / 2, lz);
    }
    box(g, metalMat, F.legFootWidth, t, t, tcx, baseY + t / 2, lz);
  }

  // ── STRETCHER BAR (along Z) ──
  const stretcherLen = F.tableLength - 2 * F.legInsetX;
  box(g, metalMat, t, t, stretcherLen, tcx, baseY + F.stretcherH, tcz);

  // ── 6 CHAIRS (3 per long side, long sides now face ±X) ──
  const chairCount = 3;
  const totalChairSpan = chairCount * F.chairSeatW + (chairCount - 1) * F.chairGap;
  const chairStartZ = tcz - totalChairSpan / 2 + F.chairSeatW / 2;
  const ct = F.chairLegTube;
  const seatTopY = baseY + F.chairSeatH;

  for (const faceX of [-1, 1]) {
    const chairCX = tcx + faceX * (F.tableWidth / 2 + F.chairGap + F.chairSeatD / 2);

    for (let i = 0; i < chairCount; i++) {
      const chairCZ = chairStartZ + i * (F.chairSeatW + F.chairGap);

      const frontH = F.chairSeatH;
      const backH = F.chairSeatH + F.chairBackH;
      const halfW = F.chairFootWidth / 2;

      // Front edge is toward table (faceX side), back edge is away
      const frontX = chairCX - faceX * F.chairSeatD / 2;
      const backX = chairCX + faceX * F.chairSeatD / 2;

      // 2 sled U-frames (left and right of chair, along Z)
      for (const sideZ of [-1, 1]) {
        const chz = chairCZ + sideZ * halfW;
        box(g, metalMat, ct, frontH, ct, frontX, baseY + frontH / 2, chz);
        box(g, metalMat, ct, backH, ct, backX, baseY + backH / 2, chz);
        box(g, metalMat, F.chairSeatD, ct, ct, chairCX, baseY + ct / 2, chz);
      }

      // Cross stretchers (connect left-right along Z at front and back)
      box(g, metalMat, ct, ct, F.chairFootWidth,
          frontX, baseY + F.stretcherH * 0.6, chairCZ);
      box(g, metalMat, ct, ct, F.chairFootWidth,
          backX, baseY + F.stretcherH * 0.6, chairCZ);

      // Wicker seat pad
      box(g, wickerMat, F.chairSeatD, 0.025, F.chairSeatW,
          chairCX, seatTopY - 0.0125, chairCZ);

      // Wicker backrest panel
      box(g, wickerMat, 0.02, F.chairBackH - 0.05, F.chairSeatW,
          backX, seatTopY + (F.chairBackH - 0.05) / 2, chairCZ);
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// SUN POSITION (astronomical)
// ═══════════════════════════════════════════════════════════════
function updateSunPosition() {
  const {month, hour, latitude, orientation} = CONFIG.sun;
  const DEG = Math.PI / 180;

  // Approximate day-of-year for mid-month
  const daysInMonth = [31,28,31,30,31,30,31,31,30,31,30,31];
  let dayOfYear = 0;
  for (let i = 0; i < month - 1; i++) dayOfYear += daysInMonth[i];
  dayOfYear += 15; // mid-month

  // Solar declination (degrees)
  const declination = 23.44 * Math.sin(2 * Math.PI / 365 * (284 + dayOfYear));

  // Hour angle (degrees) — 0 at solar noon, negative morning, positive afternoon
  const hourAngle = 15 * (hour - 12);

  // Convert to radians
  const latRad = latitude * DEG;
  const decRad = declination * DEG;
  const haRad = hourAngle * DEG;

  // Solar altitude (elevation above horizon)
  const sinAlt = Math.sin(latRad) * Math.sin(decRad) +
                 Math.cos(latRad) * Math.cos(decRad) * Math.cos(haRad);
  const altitude = Math.asin(Math.max(-1, Math.min(1, sinAlt)));

  // Solar azimuth from south: acos gives 0..π, positive = east of south
  // Afternoon (hourAngle > 0): sun is west, so negate → negative = west
  const cosAz = (Math.sin(decRad) - Math.sin(altitude) * Math.sin(latRad)) /
                (Math.cos(altitude) * Math.cos(latRad));
  let azimuth = Math.acos(Math.max(-1, Math.min(1, cosAz)));
  if (hourAngle > 0) azimuth = -azimuth;

  // Convert to compass bearing from north (clockwise): subtract from π
  // East of south (+az) → bearing < 180°, West of south (-az) → bearing > 180°
  const compassAz = Math.PI - azimuth;
  const orientedAz = compassAz + orientation * DEG;

  // Convert spherical to Cartesian (Y-up)
  // azimuth 0 (north) = -Z, 90° (east) = +X
  const radius = 20;
  if (altitude > 0) {
    const x = radius * Math.cos(altitude) * Math.sin(orientedAz);
    const y = radius * Math.sin(altitude);
    const z = -radius * Math.cos(altitude) * Math.cos(orientedAz);
    sunLight.position.set(x, y, z);

    // Intensity: full at high sun, reduced at low angles
    const altDeg = altitude / DEG;
    sunLight.intensity = Math.min(0.9, 0.2 + 0.7 * Math.sin(altitude));

    // Color: warm (orange) at low sun, white at high sun
    const warmth = 1 - Math.min(1, altDeg / 45);
    const r = 1;
    const g = 1 - warmth * 0.15;
    const b = 1 - warmth * 0.4;
    sunLight.color.setRGB(r, g, b);
  } else {
    // Sun below horizon
    sunLight.intensity = 0;
    sunLight.position.set(0, -5, 0);
  }
  drawCompass();
}

// ═══════════════════════════════════════════════════════════════
// COMPASS
// ═══════════════════════════════════════════════════════════════
function drawCompass() {
  const cv = document.getElementById('compass');
  const ctx = cv.getContext('2d');
  const sz = cv.width, cx = sz/2, cy = sz/2, r = sz/2 - 14;

  // Rotation so N appears at correct screen position
  // With orientation=0: North = -Z. Camera orbit.theta determines view angle.
  const rot = Math.PI/2 - orbit.theta + CONFIG.sun.orientation * Math.PI/180;

  ctx.clearRect(0, 0, sz, sz);

  // Background
  ctx.beginPath();
  ctx.arc(cx, cy, r + 8, 0, 2*Math.PI);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Tick lines
  const dirs = [
    {l:'N', a:0,          c:'#ff4444'},
    {l:'E', a:Math.PI/2,  c:'#999'},
    {l:'S', a:Math.PI,    c:'#999'},
    {l:'W', a:3*Math.PI/2,c:'#999'}
  ];
  dirs.forEach(d => {
    const a = d.a + rot;
    ctx.beginPath();
    ctx.moveTo(cx + r*0.3*Math.sin(a), cy - r*0.3*Math.cos(a));
    ctx.lineTo(cx + r*0.6*Math.sin(a), cy - r*0.6*Math.cos(a));
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.stroke();
  });

  // North arrow
  const na = rot;
  const tip = r*0.65;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(na);
  ctx.beginPath();
  ctx.moveTo(0, -tip);
  ctx.lineTo(-4, -tip + 12);
  ctx.lineTo(4, -tip + 12);
  ctx.closePath();
  ctx.fillStyle = '#ff4444';
  ctx.fill();
  ctx.restore();

  // Labels
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  dirs.forEach(d => {
    const a = d.a + rot;
    const lr = r;
    ctx.font = d.l === 'N' ? 'bold 13px sans-serif' : '10px sans-serif';
    ctx.fillStyle = d.c;
    ctx.fillText(d.l, cx + lr*Math.sin(a), cy - lr*Math.cos(a));
  });

  // Center dot
  ctx.beginPath();
  ctx.arc(cx, cy, 2, 0, 2*Math.PI);
  ctx.fillStyle = '#555';
  ctx.fill();
}

// ═══════════════════════════════════════════════════════════════
// DIMENSION ANNOTATIONS
// ═══════════════════════════════════════════════════════════════
function buildDimensions() {
  // Clear all dim sub-groups, then remove them from the dims parent
  Object.keys(dimGroups).forEach(name => clearDimGroup(name));
  const g = groups.dims;
  while (g.children.length) g.remove(g.children[0]);

  // (Re)create sub-groups
  ['foundation', 'posts', 'brickWall'].forEach(name => {
    dimGroups[name] = new THREE.Group();
    g.add(dimGroups[name]);
    const cb = document.getElementById('c_dims_' + name);
    if (cb) dimGroups[name].visible = cb.checked;
  });

  buildDimsFoundation();
  buildDimsPosts();
  buildDimsBrickWall();
}

function buildDimsFoundation() {
  const sg = dimGroups.foundation;
  if (!sg) return;
  const {length, width} = CONFIG.foundation;

  // Length along front edge
  createDimension(sg,
    new THREE.Vector3(-length/2, 0, -width/2),
    new THREE.Vector3( length/2, 0, -width/2),
    { offsetDir: new THREE.Vector3(0, 0, -1), offsetDist: 0.4,
      tickDir: new THREE.Vector3(0, 0, -1) }
  );
  // Width along left edge
  createDimension(sg,
    new THREE.Vector3(-length/2, 0, -width/2),
    new THREE.Vector3(-length/2, 0,  width/2),
    { offsetDir: new THREE.Vector3(-1, 0, 0), offsetDist: 0.4,
      tickDir: new THREE.Vector3(-1, 0, 0) }
  );
}

function buildDimsPosts() {
  const sg = dimGroups.posts;
  if (!sg) return;
  const positions = getPostPositions();
  if (positions.length < 2) return;

  const fndTop = CONFIG.foundation.thickness;
  const wallHeight = CONFIG.brickWall.wallHeight;
  const midY = fndTop + wallHeight / 2;

  // Group by row — dimension along X between adjacent posts
  const rows = {};
  positions.forEach(p => { if (!rows[p.row]) rows[p.row] = []; rows[p.row].push(p); });

  Object.keys(rows).forEach((rowKey, ri) => {
    const rowPosts = rows[rowKey].sort((a, b) => a.x - b.x);
    const row = parseInt(rowKey);
    const zSign = row === 0 ? -1 : 1;
    const oDist = 0.4 + ri * 0.15;
    for (let i = 0; i < rowPosts.length - 1; i++) {
      createDimension(sg,
        new THREE.Vector3(rowPosts[i].x, midY, rowPosts[i].z),
        new THREE.Vector3(rowPosts[i+1].x, midY, rowPosts[i+1].z),
        { offsetDir: new THREE.Vector3(0, 0, zSign), offsetDist: oDist,
          tickDir: new THREE.Vector3(0, 0, zSign) }
      );
    }
  });

  // Group by column — dimension along Z between adjacent posts
  const cols = {};
  positions.forEach(p => { if (!cols[p.col]) cols[p.col] = []; cols[p.col].push(p); });

  Object.keys(cols).forEach((colKey, ci) => {
    const colPosts = cols[colKey].sort((a, b) => a.z - b.z);
    const col = parseInt(colKey);
    const xSign = col === 0 ? -1 : 1;
    const oDist = 0.4 + ci * 0.15;
    for (let i = 0; i < colPosts.length - 1; i++) {
      createDimension(sg,
        new THREE.Vector3(colPosts[i].x, midY, colPosts[i].z),
        new THREE.Vector3(colPosts[i+1].x, midY, colPosts[i+1].z),
        { offsetDir: new THREE.Vector3(xSign, 0, 0), offsetDist: oDist,
          tickDir: new THREE.Vector3(xSign, 0, 0) }
      );
    }
  });
}

function buildDimsBrickWall() {
  const sg = dimGroups.brickWall;
  if (!sg) return;
  const {longSideCoverage, shortSideCoverage, wallHeight} = CONFIG.brickWall;
  if (longSideCoverage <= 0 && shortSideCoverage <= 0) return;

  const {totalX, totalZ} = getPostGridDimensions();
  const fndTop = CONFIG.foundation.thickness;
  const cornerX = totalX / 2;
  const cornerZ = totalZ / 2;
  const longSpan = totalX * longSideCoverage;
  const shortSpan = totalZ * shortSideCoverage;

  // Long wall span
  if (longSideCoverage > 0) {
    createDimension(sg,
      new THREE.Vector3(cornerX, fndTop + wallHeight/2, cornerZ),
      new THREE.Vector3(cornerX - longSpan, fndTop + wallHeight/2, cornerZ),
      { offsetDir: new THREE.Vector3(0, 0, 1), offsetDist: 0.3,
        tickDir: new THREE.Vector3(0, 0, 1) }
    );
  }
  // Short wall span
  if (shortSideCoverage > 0) {
    createDimension(sg,
      new THREE.Vector3(cornerX, fndTop + wallHeight/2, cornerZ),
      new THREE.Vector3(cornerX, fndTop + wallHeight/2, cornerZ - shortSpan),
      { offsetDir: new THREE.Vector3(1, 0, 0), offsetDist: 0.3,
        tickDir: new THREE.Vector3(1, 0, 0) }
    );
  }
  // Wall height (vertical)
  if (longSideCoverage > 0) {
    createDimension(sg,
      new THREE.Vector3(cornerX - longSpan, fndTop, cornerZ),
      new THREE.Vector3(cornerX - longSpan, fndTop + wallHeight, cornerZ),
      { offsetDir: new THREE.Vector3(-1, 0, 0), offsetDist: 0.3,
        tickDir: new THREE.Vector3(-1, 0, 0) }
    );
  }
}

// ═══════════════════════════════════════════════════════════════
// REBUILD ALL
// ═══════════════════════════════════════════════════════════════
function rebuildModel() {
  buildGround();
  buildFoundation();
  buildPathways();
  buildPosts();
  buildBeams();
  buildRidge();
  buildBraces();
  buildRafters();
  buildRoof();
  buildPanelling();
  buildBrickWall();
  buildKitchen();
  buildKitchenBackdrop();
  buildFence();
  buildFurniture();
  buildDimensions();
  updateSunPosition();
}

let rebuildTimer;
function scheduleRebuild() {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(rebuildModel, 60);
}

// ═══════════════════════════════════════════════════════════════
// GUI GENERATION
// ═══════════════════════════════════════════════════════════════
function createGUI() {
  const container = document.getElementById('gui-sections');
  container.innerHTML = '';
  const sections = GUI_SCHEMA.filter(sec => (sec.tab || 'pavilion') === currentTab);
  sections.forEach((sec, si) => {
    const div = document.createElement('div');
    div.className = 'gs' + (sec.open ? ' open' : '');
    let html = `<div class="gh" onclick="this.parentElement.classList.toggle('open')">
      <span>${sec.section}</span><span class="ar">▶</span></div><div class="gb">`;

    sec.controls.forEach(ctrl => {
      if (ctrl.type === 'checkbox') {
        html += `<div class="gc">
          <input type="checkbox" id="c_${ctrl.k}" checked
            onchange="onToggleGroup('${ctrl.k}',this.checked)">
          <label for="c_${ctrl.k}">${ctrl.l}</label>
        </div>`;
      } else if (ctrl.type === 'select') {
        const val = cfgGet(ctrl.k);
        const id = ctrl.k.replace(/\./g, '_');
        const opts = ctrl.options.map((opt, i) =>
          `<option value="${i}"${i === val ? ' selected' : ''}>${opt}</option>`
        ).join('');
        html += `<div class="gr">
          <label>${ctrl.l}</label>
          <select class="gs-sel" id="s_${id}" onchange="onSelect('${ctrl.k}', this.value)">${opts}</select>
        </div>`;
      } else {
        const val = cfgGet(ctrl.k);
        const dec = ctrl.s < 0.01 ? 3 : ctrl.s < 0.1 ? 2 : ctrl.s >= 1 ? 0 : 1;
        const id = ctrl.k.replace(/\./g, '_');
        html += `<div class="gr">
          <label>${ctrl.l}</label>
          <input type="range" id="r_${id}" min="${ctrl.mn}" max="${ctrl.mx}" step="${ctrl.s}" value="${val}"
            oninput="onSlider('${ctrl.k}','${id}',this.value,${dec})">
          <input type="text" class="gv" id="v_${id}" value="${val.toFixed(dec)}"
            onchange="onValue('${ctrl.k}','${id}',this.value,${dec})"
            onkeydown="if(event.key==='Enter')this.blur()">
        </div>`;
      }
    });
    html += '</div>';
    div.innerHTML = html;
    container.appendChild(div);
  });
}

window.onSlider = function(key, id, val, dec) {
  val = parseFloat(val);
  cfgSet(key, val);
  document.getElementById('v_'+id).value = val.toFixed(dec);
  if (key.startsWith('sun.')) { updateSunPosition(); } else { scheduleRebuild(); }
};

window.onSelect = function(key, val) {
  cfgSet(key, parseInt(val, 10));
  scheduleRebuild();
};

window.onValue = function(key, id, val, dec) {
  val = parseFloat(val);
  if (isNaN(val)) return;
  cfgSet(key, val);
  document.getElementById('r_'+id).value = val;
  document.getElementById('v_'+id).value = val.toFixed(dec);
  if (key.startsWith('sun.')) { updateSunPosition(); } else { scheduleRebuild(); }
};

window.onToggleGroup = function(groupName, visible) {
  if (groupName === 'dims') {
    if (groups.dims) groups.dims.visible = visible;
  } else if (groupName.startsWith('dims_')) {
    const section = groupName.slice(5);
    if (dimGroups[section]) dimGroups[section].visible = visible;
  } else if (groups[groupName]) {
    groups[groupName].visible = visible;
  }
};

window.toggleGUI = function() {
  document.getElementById('gui').classList.toggle('collapsed');
  document.getElementById('toggle').classList.toggle('collapsed');
};

// ═══════════════════════════════════════════════════════════════
// TAB SWITCHING — Pavilion vs Kitchen
// ═══════════════════════════════════════════════════════════════
// Groups visible only in the pavilion tab
const PAVILION_ONLY_GROUPS = ['foundation','pathways','posts','beams','ridge','braces',
  'rafters','roof','panelling','brickWall','fence','furniture','dims'];
// Groups visible only in the kitchen tab
const KITCHEN_ONLY_GROUPS = ['kitchenBackdrop','kitchenSlab'];

// Per-tab orbit snapshots
const TAB_ORBIT = {
  pavilion: { theta: Math.PI*0.25, phi: Math.PI*0.32, radius: 14,
              targetX: 0, targetY: 1.8, targetZ: 0 },
  kitchen:  { theta: -Math.PI*0.45, phi: Math.PI*0.42, radius: 4.2,
              // target computed dynamically from kitchen footprint at switch time
              targetX: null, targetY: 1.0, targetZ: null }
};

function computeKitchenCameraTarget() {
  const K = CONFIG.kitchen;
  const wallBrickWidth = CONFIG.brickWall.brickWidth;
  const {totalX, totalZ} = getPostGridDimensions();
  const cornerX = totalX / 2;
  const cornerZ = totalZ / 2;
  const wallInteriorZ = cornerZ - wallBrickWidth / 2;
  const kitchenStartX = cornerX - wallBrickWidth / 2;
  const kitchenEndX = kitchenStartX - K.length;
  return {
    x: (kitchenStartX + kitchenEndX) / 2,
    y: CONFIG.foundation.thickness + K.height - 0.10,
    z: wallInteriorZ - K.depth / 2
  };
}

window.switchTab = function(tab) {
  if (tab === currentTab) return;
  // Save current orbit snapshot for the tab we're leaving
  TAB_ORBIT[currentTab].theta = orbit.theta;
  TAB_ORBIT[currentTab].phi = orbit.phi;
  TAB_ORBIT[currentTab].radius = orbit.radius;
  if (currentTab === 'pavilion') {
    TAB_ORBIT.pavilion.targetX = orbit.target.x;
    TAB_ORBIT.pavilion.targetY = orbit.target.y;
    TAB_ORBIT.pavilion.targetZ = orbit.target.z;
  }

  currentTab = tab;
  // Toggle group visibility
  PAVILION_ONLY_GROUPS.forEach(n => { if (groups[n]) groups[n].visible = (tab === 'pavilion'); });
  KITCHEN_ONLY_GROUPS.forEach(n => { if (groups[n]) groups[n].visible = (tab === 'kitchen'); });
  // Force kitchen visible when in kitchen tab (in case user unchecked it from pavilion)
  if (tab === 'kitchen' && groups.kitchen) groups.kitchen.visible = true;

  // Update active tab button styling
  document.getElementById('tab_pavilion').classList.toggle('active', tab === 'pavilion');
  document.getElementById('tab_kitchen').classList.toggle('active', tab === 'kitchen');

  // Camera reposition
  const snap = TAB_ORBIT[tab];
  orbit.theta = snap.theta;
  orbit.phi = snap.phi;
  orbit.radius = snap.radius;
  if (tab === 'kitchen') {
    const t = computeKitchenCameraTarget();
    orbit.target.set(t.x, snap.targetY, t.z);
  } else {
    orbit.target.set(snap.targetX, snap.targetY, snap.targetZ);
  }
  updateCam();

  // Regenerate GUI sections for the new tab
  createGUI();

  // Refresh HUD stats
  if (tab === 'kitchen') {
    // Trigger a kitchen rebuild so updateStats fires with kitchen info
    buildKitchen();
  } else {
    // Pavilion stats from brick wall
    buildBrickWall();
  }
};

// ═══════════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

// ═══════════════════════════════════════════════════════════════
// INITIALIZE
// ═══════════════════════════════════════════════════════════════
initScene();
initControls();
createGUI();
rebuildModel();
// Default tab is pavilion: hide kitchen-only backdrop groups
KITCHEN_ONLY_GROUPS.forEach(n => { if (groups[n]) groups[n].visible = false; });
animate();
</script>
